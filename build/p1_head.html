   made of cards that padding is invisible — it is the page, and the cards sit
   on the page. Base camp is not made of cards. It is a scene with its own
   floor, several shades off the page behind it, so the reserved room read as a
   dead band across the bottom of the phone: 41px of it at a 34px inset, 25 of
   those below the nav pill and fully exposed. Every other app on the phone
   looks fine for exactly the reason this one did not.

   Extended rather than moved. Giving .camp the padding back would drag
   .camp-spots down with it and put the bottom row of tents under the nav,
   which is the thing the reservation exists to prevent — so the objects stay
   where they stand and only the ground carries on beneath them.

   A separate block rather than a taller .camp-ground, because that gradient's
   stops are proportional: stretching the box moves the transparent-to-solid
   ramp at its top down the screen, and that ramp is where the range's foot
   meets the moraine. It ends at #06070C, so continuing in #06070C is seamless
   by construction rather than by a matched guess.

   Sized to the padding exactly. Overshooting would add to the scroller's
   overflow and give the screen further to scroll for nothing. */
.camp-ground::after{content:'';position:absolute;left:0;right:0;top:100%;
  height:calc(var(--navpad) + 6px);background:#06070C}
.camp-spots{position:absolute;left:calc(var(--sp) * -1);right:calc(var(--sp) * -1);
  bottom:0;height:250px;z-index:1}
/* Each destination stands on the ground at its own place and its own size.
   left/bottom put it there; --w is how big the tent is drawn. The label is
   NOT scaled with it — see the note in renderMore(). */
.spot{position:absolute;left:var(--l);bottom:var(--b);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:6px 8px 2px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--t) var(--ease-spring)}
.spot-quiet{pointer-events:none}
.spot .tent{width:var(--w);height:calc(var(--w) * .683);display:block;
  transition:filter .3s ease}
.spot-l{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-dim);white-space:nowrap;
  text-shadow:0 1px 4px rgba(4,6,10,.95);transition:color var(--t) ease}
/* Pressed, focused or just arrived-at: the object grows and glows in its own
   colour. No outline anywhere — the browser draws its ring round the whole
   button box, and at these sizes that is a rectangle across the camp. The glow
   IS the focus indicator, which is why it is on :focus-visible too. */
.spot:focus,.spot:focus-visible,.spot:active{outline:none}
.spot:active{transform:translateX(-50%) scale(1.07)}
.spot:focus-visible .tent,.spot:active .tent{
  filter:drop-shadow(0 0 10px var(--lit,#FFB24E)) drop-shadow(0 0 24px var(--lit,#FFB24E))}
.spot:focus-visible .spot-l,.spot:active .spot-l{color:#FFF3DC}
@media (prefers-reduced-motion: reduce){ .spot,.spot .tent{transition:none} }
/* The mountain, when it is the route. A target over the range rather than a
   shape in it: the range is one flat SVG and carving a hit area out of its
   silhouette would tie the tap to the artwork. */
.camp-route{position:absolute;left:calc(var(--sp) * -1);right:calc(var(--sp) * -1);
  bottom:250px;height:300px;z-index:1;background:none;border:0;padding:0;
  display:flex;align-items:flex-end;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.camp-route:focus,.camp-route:focus-visible,.camp-route:active{outline:none}
.camp-route-l{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);text-shadow:0 1px 4px rgba(4,6,10,.95);
  padding-bottom:6px;transition:color var(--t) ease}
.camp-route:focus-visible .camp-route-l,.camp-route:active .camp-route-l{color:#FFF3DC}
/* The moon: a control, so it gets a real target rather than the disc's own
   size. 42px of moon inside a 56px tap area. */
/* A pill, not a card. Membership is one sentence about your copy of the app;
   it had a whole section on the old More screen and said nothing a line could
   not. */
.camp-member{display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  padding:7px 14px 7px 11px;border-radius:999px;
  /* Opaque, so the words in it stand on their own ground rather than on
     whatever the mountain is doing behind them. Translucent, this pill's own
     subtitle was the worst-contrast text on the screen and the only reason the
     scrim had to cover the range. */
  background:rgba(22,17,10,.93);border:1px solid rgba(233,180,76,.38);
  color:var(--ember-2);font-size:12px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:44px;
  transition:background var(--t) ease,border-color var(--t) ease}
.camp-member:active,.camp-member:focus-visible{outline:none;
  background:rgba(233,180,76,.18);border-color:rgba(233,180,76,.55)}
.cm-dot{width:7px;height:7px;border-radius:50%;background:var(--ember);flex:none}
.cm-s{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.01em}

.camp-moon-btn{position:absolute;right:12px;top:calc(var(--safe-t) + 26px);
  z-index:4;width:72px;height:72px;display:grid;place-items:center;
  background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform var(--t) var(--ease-spring)}
.camp-moon-btn:focus,.camp-moon-btn:focus-visible,.camp-moon-btn:active{outline:none}
.camp-moon-btn:active{transform:scale(1.1)}
.camp-moon-btn:focus-visible .moon-lit,.camp-moon-btn:active .moon-lit{
  filter:drop-shadow(0 0 9px rgba(233,241,255,.9)) drop-shadow(0 0 20px rgba(200,220,255,.55))}
.camp-moon{display:block;pointer-events:none}
/* On the lit shapes, not on the <svg> — see moonHTML(). A filter on the
   element blurs the unlit disc too and paints a one-percent crescent as a
   third-lit moon. */
.camp-moon .moon-lit{filter:drop-shadow(0 0 2.5px rgba(243,236,220,.5))}
/* The gear brightens with the press, the way the lit limb does, so the thing
   the moon is FOR is what answers when you touch it. Opacity rather than a
   filter: a glow on a hairline stroke smears it into a blur instead of
   lighting it. */
.camp-moon .moon-gear{transition:stroke-opacity var(--t) ease}
.camp-moon-btn:focus-visible .moon-gear,.camp-moon-btn:active .moon-gear{stroke-opacity:.85}
.camp-name{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:10px 0 0}
.camp-sub{font-size:13.5px;line-height:1.5;color:var(--text-dim);margin:10px 0 0;max-width:38ch}
/* On the mountain, not under the name. Absolutely placed over the massif's
   lower slopes — the one part of the scene wide enough and dark enough to
   carry four numbers. z-index above the backdrop and below the tents. */
.camp-stats{position:absolute;left:0;right:0;bottom:300px;z-index:2;
  display:flex;flex-wrap:wrap;justify-content:center;gap:26px;row-gap:12px;
  pointer-events:none;text-shadow:0 1px 6px rgba(4,6,12,.9)}
.camp-stats > div{display:flex;flex-direction:column;gap:3px}
/* Ember rather than the teal every other hero uses. Teal is this app's colour
   for something completed — right over "logged today", wrong over a standing
   total, where it reads as a session you just finished. */
.camp-stats .hs-v{color:var(--ember-2)}
.hs-of{font-size:.62em;font-weight:650;color:var(--faint);margin-left:1px}

/* The arrow between a stored weight and its corrected value. */
.conv-a{display:inline-flex;align-items:center;padding:0 7px;vertical-align:-2px}
.conv-a .ico-svg{width:13px;height:13px;color:var(--faint)}

/* The first-session preview. A flex row rather than a grid, for the reason the
   set row learned the hard way: the weight column is empty on a bodyweight
   movement and the whole cell goes with it. */
.prev-eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--ember-2);margin-bottom:10px}
.prev-row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.prev-row:last-child{border-bottom:0}
.prev-n{font-size:14.5px;font-weight:600;line-height:1.3}
.prev-t{font-size:11px;color:var(--faint);margin-top:2px}
.prev-r{flex:none;font-size:13.5px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.prev-w{flex:none;min-width:52px;text-align:right;font-size:13.5px;color:var(--ember-2);font-variant-numeric:tabular-nums}

/* A value the option is being chosen *by*, in its own column — so it can be
   read down the screen instead of hunted for inside each title. */
.opt-meta{flex:none;display:flex;align-items:baseline;gap:1px;margin-top:1px;color:var(--text-dim)}
.opt.on .opt-meta{color:var(--ember-2)}
.opt-meta-n{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.opt-meta-u{font-size:11px;font-weight:600;color:var(--faint)}

/* big numeric entry */
.bignum{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:38px}
.bignum input{
  width:150px;text-align:center;font-family:var(--fm);font-size:46px;font-weight:700;
  letter-spacing:-.04em;background:transparent;border:none;border-bottom:2px solid var(--line);
  padding:6px 0;color:var(--text);
}
.bignum input:focus{outline:none;border-color:var(--ember)}
.bignum .u{font-size:19px;font-weight:650;color:var(--muted)}
.ob-input{
  width:100%;padding:17px 16px;border-radius:var(--r);background:var(--surface);
  border:1.5px solid var(--line-soft);color:var(--text);font-size:17px;margin-top:26px;
}
.ob-input:focus{outline:none;border-color:var(--ember)}

/* welcome */
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px var(--sp) 20px;animation:obIn .5s cubic-bezier(.2,.8,.3,1)}
.ob-pt{display:flex;gap:14px;align-items:flex-start;margin-top:22px}
.ob-pt-n{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--ember);padding-top:3px;flex:none;width:22px}
.ob-chapter-n{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin-bottom:14px}
.ob-chapter-t{font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:0}
.guzo-mean{font-size:12.5px;color:var(--muted);margin:14px 0 0;letter-spacing:.02em}
.guzo-mean em{font-style:italic;color:var(--text-dim)}
.guzo-mean strong{color:var(--ember);font-weight:650}

/* ============================================================
   THE JOURNEY
   ============================================================ */
.journey-strip{display:flex;align-items:center;gap:13px;width:100%;padding:11px 14px;margin-bottom:12px;
  border-radius:16px;background:linear-gradient(100deg,rgba(233,180,76,.08),rgba(233,180,76,.02));
  border:1px solid var(--ember-line);box-shadow:var(--inset);transition:transform .12s ease}
.journey-strip:active{transform:scale(.99)}
.journey-rings{display:flex;align-items:center;flex:none}
.jring{width:38px;height:38px;transform:rotate(-90deg)}
.jring-bg{fill:none;stroke:var(--surface-3);stroke-width:2.6}
.jring-fg{fill:none;stroke:var(--ember);stroke-width:2.6;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.3,0,.2,1)}
.jring-in{fill:none;stroke:var(--ember);stroke-width:2.6;opacity:.45}
.jring-dot{fill:var(--ember)}
.journey-day{font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.journey-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.journey-line{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ember)}

/* ---------- the ascent (Progress hero) ----------
   The route card and the markers list under it were the same fifteen
   milestones drawn twice. This is the merge: a switchback trail whose
   waypoints are the rows you read. See journeyAscentHTML(). */
.ascent{position:relative;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow),var(--inset);margin-bottom:20px;padding:0 0 4px}

/* Terrain behind the header only. It never sits under a row of text — a
   silhouette under a paragraph is a contrast problem wearing a nice hat.

   Faded out at its own foot, for the reason base camp's backdrop is: every
   silhouette in the range fills the box to the floor, and these boxes are
   clipped by the card they sit in. So the mountains ended on a ruled
   horizontal line with the near mass sliced off along it — visible on Today
   under the session stats and on Progress under "Day 42", and the single
   thing that made them read as a graphic pasted into a card rather than as
   distance behind it. The last 34px carry the fade; the ridgelines are all
   well above it.

   .camp-bg does its own, over a much taller box, so the camp opts out rather
   than fading twice. */
.ridge{position:absolute;left:0;right:0;top:0;height:104px;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 calc(100% - 34px),rgba(0,0,0,.45) calc(100% - 12px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 calc(100% - 34px),rgba(0,0,0,.45) calc(100% - 12px),transparent 100%)}
.camp-bg .ridge{-webkit-mask-image:none;mask-image:none}
.ridge svg{display:block;width:100%;height:100%}
.tr-ridge{height:96px;opacity:.9}
/* The pale layers, dimmed where a card's own text sits over them.

   The range is the same range on every screen — same silhouette, same five
   layers, same fade. What is not the same is how much light it can carry: on
   Plan and Progress a heading and a row of small grey type sit directly on the
   summits, and at full strength "of 15" landed on a snow cap at 1.08:1.

   Dimming the WHOLE band was the first attempt and it does not work — it takes
   the dark near mass down with the pale far one, so the range dissolves before
   the text clears. Giving the band headroom so the skyline drops below the
   heading was the second, and it only moves the collision onto the row
   underneath. What actually separates them is that only the top layers are
   bright: hold the near mass and pull the haze, the far range and the snow. */
.wk-ridge .ridge-haze{opacity:.34}
.wk-ridge .ridge-far{opacity:.36}
.wk-ridge .ridge-midfar{opacity:.56}
.wk-ridge .ridge-mid{opacity:.74}
.wk-ridge .ridge-snow{opacity:.24}
/* Progress carries the least: its card is a dense list from the heading down,
   so the band has nowhere to sit that is not behind something. Set with margin
   rather than at the edge — tuned to exactly 4.50 it passed, and a check whose
   subject sits on its own threshold is a check that goes red on a font tweak. */
.asc-ridge .ridge-haze{opacity:.13}
.asc-ridge .ridge-far{opacity:.15}
.asc-ridge .ridge-midfar{opacity:.30}
.asc-ridge .ridge-mid{opacity:.55}
.asc-ridge .ridge-snow{opacity:.08}
/* The near mass is left alone on purpose. It is #05080C — over a dark card it
   adds essentially no light, so it costs nothing against the text and it is
   the layer carrying the silhouette. Dimming the band as a whole takes it out
   with everything else, which is why that approach dissolved the range before
   the type cleared. */
/* The skyline catching the sun. It draws itself on when you arrive on the
   screen — off .entering, which go() adds and a timer removes, and never off
   .screen.on: every render replaces the body's innerHTML and the line would
   redraw itself every time you logged anything. Arriving is the only thing
   that should feel like arriving. */
/* Snow, and it needs a fill named here or it gets SVG's default — which is
   black, and paints a solid triangle on every peak that the shape is otherwise
   exactly right about. Cool rather than white: the range is lit by an ember
   gradient, and a neutral cap on a warm mountain reads as paper. */
.ridge-snow{fill:#DDE7F5;fill-opacity:.46}
.ridge-line{fill:none;stroke:var(--ember-2);stroke-width:1.4;opacity:.55;
  stroke-dasharray:1;stroke-dashoffset:0}
.ridge-line.far{stroke:var(--ember);opacity:.30;stroke-width:1.2}
@media (prefers-reduced-motion: no-preference){
  .screen.entering .ridge-line{animation:ridgeDraw 1.05s var(--ease-out) both}
  .screen.entering .ridge-line.far{animation-delay:.12s}
}
@keyframes ridgeDraw{from{stroke-dashoffset:1;opacity:0}
  55%{opacity:.55}to{stroke-dashoffset:0}}

/* ---------- the body ----------
   Flat shapes with a heavy outline rather than shading — the style is chosen
   for what hand-authored SVG is actually good at, and it reads better at
   phone size than a render would. Every colour here is the app's own: the
   body is a surface, a lit muscle is ember, and the one you have chosen is
   the brightest thing on the screen.

   Teal is deliberately absent from the heat. It already means "done" in this
   app, and a body map where teal meant "trained hard" would be the same
   colour saying two things one screen apart. */
.bd{display:block;width:100%;height:100%;overflow:visible}
.bd-body{fill:#141a21;stroke:#39465a;stroke-width:1.3;stroke-linejoin:round}
.bd-m{fill:#28323f;stroke:#4a5769;stroke-width:1.05;stroke-linejoin:round;
  transition:fill var(--t) ease,stroke var(--t) ease}
/* Lit by seven days of work. --lit is a share, not a flag: a muscle you have
   trained hard is close to ember and one you have barely touched is close to
   the resting surface, with everything between actually between. */
.bd-m[style*="--lit"]{fill:color-mix(in srgb,var(--ember) calc(var(--lit) * 66%),#28323f);
  stroke:color-mix(in srgb,var(--ember-2) calc(var(--lit) * 78%),#4a5769)}
.bd-m.on{fill:var(--ember);stroke:var(--ember-2)}
.bd-d{fill:none;stroke:#46536a;stroke-width:.9;stroke-linecap:round;opacity:.75}
.bd-hit{fill:transparent;stroke:transparent;stroke-width:13;pointer-events:all;cursor:pointer}

/* The figure on the body-map sheet. Tall and narrow, because a body is, and
   the sheet gives it the height rather than the width. */
/* The intro: the figure alongside the title rather than a wall of prose above
   the button. It is lit with a plausible week rather than yours — you have not
   trained anything through this feature yet, and a cold figure on the screen
   that is selling mobility work says the wrong thing. */
.str-intro{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding-right:40px}
.str-intro-fig{width:96px;flex:none;aspect-ratio:132/240}
.str-intro-t{min-width:0}

.bmap{position:relative;display:flex;justify-content:center}
.bmap-fig{width:100%;max-width:280px;aspect-ratio:132/240}
.bmap-turn{position:absolute;right:0;top:0;display:flex;align-items:center;gap:7px;
  min-height:44px;padding:0 14px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid var(--line);color:var(--text-dim);font-size:13px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bmap-turn:active{transform:translateY(1px) scale(.985);background:var(--surface-3)}
.bmap-turn .ico-svg{width:15px;height:15px;color:var(--ember)}
/* The joint layer. The ring is what you see and the disc is what you hit —
   a marker big enough to tap accurately would be a marker too big to place
   accurately, so the two are separated the same way the session rail separates
   its 5px band from its 44px button. */
.bd.joints .bd-m{opacity:.45}
.bd-j{cursor:pointer}
.bd-j-t{fill:transparent;pointer-events:all}
.bd-j-r{fill:rgba(10,13,18,.86);stroke:var(--muted);stroke-width:1.7;
  transition:fill var(--t) ease,stroke var(--t) ease,r var(--t) var(--ease-spring)}
.bd-j.on .bd-j-r{fill:var(--ember);stroke:var(--ember-2);r:6}
.bd-j:active .bd-j-r{stroke:var(--ember-2)}
.bmap-set .bmap-fig{max-width:252px}

.bmap-head{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:11px;
  border-radius:var(--r);background:var(--ember-dim);border:1px solid var(--ember-line)}
.bmap-head .h3{color:var(--ember-2)}
@media (prefers-reduced-motion: no-preference){
  .bmap-fig .bd{animation:bodyTurn .34s var(--ease-out)}
}
@keyframes bodyTurn{from{transform:perspective(700px) rotateY(38deg);opacity:.35}
  to{transform:none;opacity:1}}

.wk-gap{display:block;width:100%;text-align:left}

/* ---------- the route, as a route ----------
   Seven days as waypoints on one trail: teal behind you, ember where you are,
   dashed ahead. The rail is its own column so the line runs continuously
   between nodes rather than being drawn per row and meeting at a seam.

   The row was 180px and is 66. What came out was a 44px tick that duplicated
   the node, and a pill reading "A normal day" — the default, printed seven
   times. */
.wk-hero{position:relative;overflow:hidden}
.wk-hero>*:not(.ridge){position:relative}
/* Short enough to sit behind the number and the eyebrow and nothing else.
   At 112 it reached the paragraph, and a range drawn through a sentence is a
   range that has stopped being a background. */
.wk-hero .ridge{height:88px;opacity:.5}
.wk-hero-n{display:flex;align-items:baseline;gap:7px;margin-top:6px}
.wk-hero-v{font-size:38px;font-weight:700;letter-spacing:-.04em;color:var(--text);line-height:1}
.wk-hero-of{font-size:20px;font-weight:650;color:var(--on-range);letter-spacing:-.02em}
.wk-hero-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--on-range);margin-left:4px}

.wroute{display:flex;flex-direction:column}
.wr-row{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;
  min-height:66px;padding:0;background:none;border:0;color:var(--text);
  transition:opacity var(--t) ease}
.wr-rail{position:relative;width:26px;flex:none;display:flex;flex-direction:column;
  align-items:center}
.wr-line{width:2px;flex:1 1 0;background:#39465a;border-radius:2px}
.wr-row:first-child .wr-line.up,.wr-row:last-child .wr-line.down{background:transparent}
.wr-node{position:relative;flex:none;width:18px;height:18px;border-radius:50%;
  background:var(--surface-2);border:2px solid #39465a;
  display:flex;align-items:center;justify-content:center;color:var(--teal);
  transition:all var(--t) var(--ease-spring)}
.wr-node .ico-svg{width:10px;height:10px;stroke-width:3.4}
/* Behind you: solid teal, and the line into it is teal too. */
.wr-row.walked .wr-node{background:var(--teal);border-color:var(--teal);color:#06251d}
.wr-row.walked .wr-line{background:rgba(79,209,165,.55)}
/* Where you are: the biggest node on the screen, with the trail behind it
   already teal and the trail ahead of it still dashed. */
.wr-row.now .wr-node{width:24px;height:24px;background:var(--ember);
  border-color:var(--ember-2);box-shadow:0 0 0 4px rgba(233,180,76,.16)}
.wr-row.now .wr-line.up{background:rgba(79,209,165,.55)}
.wr-row.now .wr-line.down,.wr-row.ahead .wr-line{
  background:repeating-linear-gradient(180deg,#39465a 0 4px,transparent 4px 9px)}
.wr-row.ahead .wr-node{background:var(--surface);border-color:#39465a}
.wr-row.ahead{opacity:.82}
/* A day that went by without a session is not marked in red and does not
   break the trail. It is simply not filled in — see the tone rule. */
.wr-row.missed .wr-node{background:var(--surface);border-color:#2b3542}
.wr-row.missed .wr-line{background:#2b3542}
.wr-row.missed{opacity:.6}
.wr-body{flex:1;min-width:0;padding:13px 0}
.wr-d{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.wr-d b{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ember-2);background:var(--ember-dim);border:1px solid var(--ember-line);
  padding:2px 6px;border-radius:5px;margin-left:7px;vertical-align:1px}
.wr-s{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.wr-row.walked .wr-s{color:var(--teal-soft)}
.wr-c{flex:none;align-self:center;font-size:10.5px;font-weight:650;letter-spacing:.03em;
  color:var(--text-dim);background:var(--surface-2);border:1px solid var(--line);
  padding:4px 9px;border-radius:100px}
.wr-row:active .wr-body{opacity:.6}

/* ---------- the week, as an arc ---------- */
.wk-ring{position:relative;width:40px;height:40px;flex:none;display:flex;
  align-items:center;justify-content:center}
.wk-ring svg{position:absolute;inset:0;width:40px;height:40px;transform:rotate(-90deg)}
.wk-ring-t{fill:none;stroke:var(--surface-3);stroke-width:3}
.wk-ring-i{fill:none;stroke:var(--ember);stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset var(--t-slow) var(--ease-out)}
.wk-ring b{position:relative;font-family:var(--fm);font-size:17px;font-weight:700;
  color:var(--ember);letter-spacing:-.03em;line-height:1}
@media (prefers-reduced-motion: no-preference){
  .screen.entering .wk-ring-i{animation:ringFill .9s var(--ease-out) both}
}
@keyframes ringFill{from{stroke-dashoffset:1}}
/* Decoration that is position:absolute paints over static content unless the
   content is given a stacking position of its own — the same trap the ridge on
   Progress fell into, where it drew straight over the empty-state paragraph. */
.tr-ready{position:relative;overflow:hidden}
.tr-ready>*:not(.ridge){position:relative}

.asc-head{position:relative;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;padding:16px 16px 12px}
.asc-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ember)}
.asc-day{font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:5px}
.asc-count{display:flex;align-items:center;gap:7px;flex:none;padding-top:4px}
.asc-count-n{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--ember);
  line-height:1;font-variant-numeric:tabular-nums}
.asc-count-l{font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);line-height:1.25}

/* Every piece of content in this card stacks above the ridge. The ridge is
   absolutely positioned at the top and the header was the only thing given a
   stacking context, so on a fresh profile — the one state where a paragraph
   sits that high — the silhouette painted straight over the first line of it.
   Decoration must never be in front of text that was measured for contrast. */
.asc-first{position:relative;font-size:12.5px;line-height:1.55;color:var(--muted);padding:0 16px 8px}

.asc-path{position:relative;padding:2px 14px 0 12px}

/* One waypoint. The rail column holds the trail; the body holds the words. */
/* The row is tall enough that the connector under the waypoint always has
   room to make its turn. At 54px — the height of the waypoint block alone — a
   short row left the link zero pixels to drift across, so the trail jumped
   sideways in a visible kink instead of bending. */
.asc-row{display:flex;align-items:stretch;gap:11px;min-height:84px}
.asc-rail{position:relative;width:46px;flex:none}
/* Fixed height and an untouched aspect ratio, so the waypoint drawn against
   it is round. Everything that stretches lives in .asc-link. */
.asc-top{display:block;width:46px;height:54px}
/* The connector to the next row: free to stretch, because a stretched line is
   still a line. The stroke is held to weight by vector-effect. */
/* Height is stated, never left to top/bottom. An <svg> is a replaced element,
   so `height:auto` resolves from its own viewBox aspect ratio and `bottom` is
   dropped as over-constrained — every connector came out exactly 100px tall
   whatever the row did, which left a gap under a long row and an overshoot
   under a short one. */
.asc-link{position:absolute;left:0;top:54px;width:46px;height:calc(100% - 54px)}
.asc-line{fill:none;stroke-width:2.2;stroke-linecap:round}
.asc-line.walked{stroke:var(--ember);opacity:.85}
.asc-line.ahead{stroke:#4a5561;stroke-dasharray:2 6}

.asc-node-wrap{position:absolute;transform:translate(-50%,-50%);line-height:0}
.asc-node{position:relative;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--surface-2);box-sizing:border-box}
.asc-ico{font-size:15px;line-height:1}
.asc-node.done{background:var(--ember-dim);border-color:var(--ember)}
.asc-node.next{border-color:transparent;background:var(--surface-3)}
.asc-node.far{background:var(--surface-2);border-color:var(--line);opacity:.75}
/* You are here. Small, teal, and the only thing on the trail that is not a
   marker — it is a position, not an achievement. */
.asc-node.here{width:16px;height:16px;border:0;background:var(--teal);
  box-shadow:0 0 0 4px rgba(79,209,165,.16)}
.asc-node.here .asc-ico{display:none}

/* The progress ring on the marker you are walking towards. Same number the
   list drew as a separate bar. */
.asc-ring{position:absolute;left:-3px;top:-3px;width:40px;height:40px;transform:rotate(-90deg)}
.asc-ring-t{fill:none;stroke:var(--surface-3);stroke-width:3}
.asc-ring-i{fill:none;stroke:var(--ember);stroke-width:3;stroke-linecap:round}

.asc-body{flex:1;min-width:0;padding:14px 0 14px}
.asc-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em;color:var(--muted)}
.asc-row.done .asc-t,.asc-row.next .asc-t{color:var(--text)}
.asc-d{font-size:11.5px;color:var(--faint);margin-top:3px;letter-spacing:.03em}
.asc-row.done .asc-d{color:var(--muted)}
.asc-when{font-size:11px;color:var(--ember-2);flex:none;padding-top:2px;letter-spacing:.03em}
.asc-row:not(.done) .asc-when{color:var(--muted);font-size:12px}
.asc-of{color:var(--faint)}
.asc-body-t{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:5px;
  padding-left:10px;border-left:2px solid var(--ember-line)}
.asc-away{font-size:11.5px;color:var(--ember-2);margin-top:5px;letter-spacing:.03em}
.asc-here-t{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--teal-soft)}
.asc-row.here{min-height:72px}
.asc-row.here .asc-body{padding:10px 0}
.asc-row.far{min-height:74px}
.asc-row.far .asc-body{padding:10px 0}
.asc-oneline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0}
.asc-need{font-size:11.5px;color:var(--faint);flex:none;letter-spacing:.03em}

/* What was cut from each end of the shown route, stated rather than dropped. */
.asc-cap{position:relative;display:flex;align-items:center;gap:9px;padding:2px 16px 0 12px}
.asc-cap-l{width:46px;flex:none;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.asc-cap-t{font-size:11px;color:var(--faint);letter-spacing:.03em}

/* The end of the route, and the last waypoint on it. */
.asc-row.summit{min-height:70px;padding-bottom:6px}
.asc-node.summit{width:40px;height:28px;border:0;background:none;border-radius:0}
.asc-node.summit svg{width:40px;height:26px;display:block}
.asc-peak-f{fill:var(--surface-3);stroke:var(--line);stroke-width:1}
.asc-peak-s{fill:var(--ember);opacity:.8}
.asc-summit-t{font-size:13.5px;font-weight:650;letter-spacing:.01em;color:var(--text-dim)}
.asc-row.summit .asc-body{padding:12px 0 8px}

/* Four figures, stated. The bordered tiles they replace competed with each
   other and with every card below them. */
.log{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  padding:14px 0}
.log-i{text-align:center;min-width:0;padding:0 4px;border-right:1px solid var(--line-soft)}
.log-i:last-child{border-right:0}
.log-v{font-family:var(--fm);font-size:19px;font-weight:700;letter-spacing:-.03em;
  line-height:1.1;font-variant-numeric:tabular-nums}
.log-k{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:650;line-height:1.25}

/* The eight-week climb */
.elev{display:block;width:100%;height:92px}
.elev-line{fill:none;stroke:var(--ember);stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke}
.elev-dot{fill:var(--ember);opacity:.55}
.elev-dot.last{opacity:1}
/* The week you are standing in: dashed, because it is not finished. */
.elev-open{stroke-dasharray:3 4;opacity:.6}

.milestone{padding:22px 18px;border-radius:20px;text-align:center;
  background:linear-gradient(180deg,rgba(233,180,76,.12),rgba(233,180,76,.02));
  border:1px solid var(--ember);box-shadow:0 0 0 4px rgba(233,180,76,.06),var(--inset);
  animation:msIn .5s cubic-bezier(.2,.9,.3,1)}
@keyframes msIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.milestone-ico{font-size:38px;line-height:1}
.milestone-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ember);margin-top:12px}
.milestone-t{font-size:21px;font-weight:700;letter-spacing:-.025em;margin-top:6px}
.milestone-b{font-size:13.5px;color:var(--text-dim);line-height:1.55;margin:10px auto 0;max-width:34ch}

/* editable starting weights */
.seedrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);transition:border-color .18s ease}
.seedrow.edited{border-color:var(--ember-line);background:linear-gradient(180deg,rgba(233,180,76,.06),transparent)}
.seed-wrap{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.seed-field{display:flex;align-items:baseline;gap:5px;border-bottom:1.5px solid var(--line);transition:border-color .18s ease}
.seedrow.edited .seed-field{border-color:var(--ember)}
.seed-in{width:76px;text-align:right;font-family:var(--fm);font-size:20px;font-weight:700;
  letter-spacing:-.02em;background:transparent;border:none;padding:3px 0;color:var(--text)}
.seed-in:focus{outline:none}
.seedrow.edited .seed-in{color:var(--ember)}
.seed-u{font-size:12px;font-weight:600;color:var(--muted)}
.seed-tag{font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.seedrow.edited .seed-tag{color:var(--ember-2)}

/* day rows in the week builder */
.dayrow{
  display:flex;align-items:center;gap:14px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  transition:transform .12s ease,border-color .15s ease;
}
.dayrow:active{transform:scale(.99)}
.dayrow.off{opacity:.5}
.dayrow.past{opacity:.32;pointer-events:none}
.dayrow-d{width:46px;flex:none;text-align:center}
.dayrow-d .n{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--faint)}
.dayrow-d .v{font-size:19px;font-weight:700;font-family:var(--fm);letter-spacing:-.03em;line-height:1.1}
.dayrow-bar{width:3px;align-self:stretch;border-radius:100px;background:var(--surface-3);flex:none}
.dayrow-bar.l3{background:linear-gradient(180deg,var(--ember),var(--ember-2))}
.dayrow-bar.l2{background:var(--ember)}
.dayrow-bar.l1{background:rgba(233,180,76,.5)}
.dayrow-bar.l0{background:var(--surface-3)}

/* ---------- reduced motion ----------
   Someone who has asked their phone to stop animating things has asked for a
   reason. Keep every state change, drop every transition. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .screen{animation:none!important}
  .sheet{transition:none!important}
}
</style>
