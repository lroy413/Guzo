.opt-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ember-2);background:var(--ember-dim);border:1px solid var(--ember-line);padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle}

/* big numeric entry */
.bignum{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:38px}
.bignum input{
  width:150px;text-align:center;font-family:var(--fm);font-size:46px;font-weight:700;
  letter-spacing:-.04em;background:transparent;border:none;border-bottom:2px solid var(--line);
  padding:6px 0;color:var(--text);
}
.bignum input:focus{outline:none;border-color:var(--ember)}
.bignum .u{font-size:19px;font-weight:650;color:var(--muted)}
.ob-input{
  width:100%;padding:17px 16px;border-radius:var(--r);background:var(--surface);
  border:1.5px solid var(--line-soft);color:var(--text);font-size:17px;margin-top:26px;
}
.ob-input:focus{outline:none;border-color:var(--ember)}

/* welcome */
.ob-hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px var(--sp) 20px;animation:obIn .5s cubic-bezier(.2,.8,.3,1)}
.ob-pt{display:flex;gap:14px;align-items:flex-start;margin-top:22px}
.ob-pt-n{font-family:var(--fm);font-size:12px;font-weight:700;color:var(--ember);padding-top:3px;flex:none;width:22px}
.ob-chapter-n{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin-bottom:14px}
.ob-chapter-t{font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:0}
.guzo-mean{font-size:12.5px;color:var(--muted);margin:14px 0 0;letter-spacing:.02em}
.guzo-mean em{font-style:italic;color:var(--text-dim)}
.guzo-mean strong{color:var(--ember);font-weight:650}

/* ============================================================
   THE JOURNEY
   ============================================================ */
.journey-strip{display:flex;align-items:center;gap:13px;width:100%;padding:11px 14px;margin-bottom:12px;
  border-radius:16px;background:linear-gradient(100deg,rgba(233,180,76,.08),rgba(233,180,76,.02));
  border:1px solid var(--ember-line);box-shadow:var(--inset);transition:transform .12s ease}
.journey-strip:active{transform:scale(.99)}
.journey-rings{display:flex;align-items:center;flex:none}
.jring{width:38px;height:38px;transform:rotate(-90deg)}
.jring-bg{fill:none;stroke:var(--surface-3);stroke-width:2.6}
.jring-fg{fill:none;stroke:var(--ember);stroke-width:2.6;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.3,0,.2,1)}
.jring-in{fill:none;stroke:var(--ember);stroke-width:2.6;opacity:.45}
.jring-dot{fill:var(--ember)}
.journey-day{font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.journey-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.journey-line{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--ember)}

/* ---------- the route (Progress hero) ----------
   The one place the journey metaphor is drawn rather than implied. Everything
   in it is real data; the styling is what makes it feel like ground you have
   walked instead of a chart of it. */
.route{position:relative;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow),var(--inset);margin-bottom:20px}
/* A single soft light source at the top, so the card has a horizon rather
   than a flat fill. Behind everything and never over text. */
.route-sky{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% -18%,rgba(233,180,76,.16),transparent 62%)}
.route-head{position:relative;display:flex;align-items:flex-start;
  justify-content:space-between;gap:14px;padding:18px 18px 0}
.route-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ember-2)}
.route-day{font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:5px}
.route-count{display:flex;align-items:center;gap:7px;flex:none;padding-top:4px}
.route-count-n{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--ember);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.route-count-l{font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);line-height:1.25}

.route-svg{display:block;width:100%;height:auto;margin-top:2px}
.route-walked{fill:none;stroke:var(--ember);stroke-width:2.2;stroke-linecap:round}
/* Dashed, and half the weight — ground you have not covered yet should not
   look the same as ground you have. */
.route-ahead{fill:none;stroke:#3b444f;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 6}
.rt-pin circle{fill:var(--surface-3);stroke:var(--line);stroke-width:1.5}
.rt-pin.on circle{fill:#332714;stroke:var(--ember)}
.rt-pin.ahead{opacity:.5}
.route-here{fill:var(--teal);stroke:#0F1216;stroke-width:2}

.route-foot{position:relative;display:flex;align-items:baseline;gap:10px;
  padding:2px 18px 16px;flex-wrap:wrap}
.route-next{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.route-next-k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.route-next-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.route-next-d{font-size:12px;color:var(--muted)}
.route-behind{font-size:11px;color:var(--faint);flex:none}

/* Four figures, stated. The bordered tiles they replace competed with each
   other and with every card below them. */
.log{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  padding:14px 0}
.log-i{text-align:center;min-width:0;padding:0 4px;border-right:1px solid var(--line-soft)}
.log-i:last-child{border-right:0}
.log-v{font-family:var(--fm);font-size:19px;font-weight:700;letter-spacing:-.03em;
  line-height:1.1;font-variant-numeric:tabular-nums}
.log-k{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:650;line-height:1.25}

/* The eight-week climb */
.elev{display:block;width:100%;height:92px}
.elev-line{fill:none;stroke:var(--ember);stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke}
.elev-dot{fill:var(--ember);opacity:.55}
.elev-dot.last{opacity:1}
/* The week you are standing in: dashed, because it is not finished. */
.elev-open{stroke-dasharray:3 4;opacity:.6}

.jpath{position:relative;padding-left:4px}
.jnode{display:flex;align-items:flex-start;gap:13px;padding:12px 0 12px 0;position:relative}
.jnode:not(:last-child)::before{content:'';position:absolute;left:17px;top:40px;bottom:-4px;width:2px;
  background:linear-gradient(180deg,var(--line),transparent)}
.jnode.done:not(:last-child)::before{background:linear-gradient(180deg,var(--ember-line),var(--line))}
.jnode-ico{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--surface-2);border:1.5px solid var(--line);z-index:1}
.jnode.done .jnode-ico{background:var(--ember-dim);border-color:var(--ember)}
.jnode-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em;color:var(--muted)}
.jnode.done .jnode-t{color:var(--text)}
.jnode-d{font-size:11.5px;color:var(--faint);margin-top:3px;letter-spacing:.03em}
.jnode.done .jnode-d{color:var(--muted)}
/* The date sits on the title's line rather than under it, so the right side of
   every row carries something and the row reads as one statement. */
.jnode-when{font-size:11px;color:var(--ember-2);flex:none;padding-top:2px;letter-spacing:.03em}
.jnode:not(.done) .jnode-when{color:var(--muted);font-size:12px}
.jnode-of{color:var(--faint)}
/* The sentence behind the marker you just passed. It was written for this and
   was only ever shown once, in the sheet at the end of a session. */
.jnode-body{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:5px;
  padding-left:11px;border-left:2px solid var(--ember-line)}
/* Only the next one gets a bar — a road of progress bars is a to-do list. */
.jnode-bar{height:4px;border-radius:100px;background:var(--surface-3);
  overflow:hidden;margin-top:8px}
.jnode-bar i{display:block;height:100%;border-radius:100px;background:var(--ember)}
.jnode.next .jnode-t{color:var(--text)}
.jnode.next .jnode-ico{border-color:var(--ember-line);background:var(--surface-3)}
/* Markers further along: one line, title left and cost right, so the row is
   balanced rather than a heading with dead space beside it. */
.jnode.far{padding:9px 0}
.jnode-oneline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0}
.jnode-need{font-size:11.5px;color:var(--faint);flex:none;letter-spacing:.03em}

.milestone{padding:22px 18px;border-radius:20px;text-align:center;
  background:linear-gradient(180deg,rgba(233,180,76,.12),rgba(233,180,76,.02));
  border:1px solid var(--ember);box-shadow:0 0 0 4px rgba(233,180,76,.06),var(--inset);
  animation:msIn .5s cubic-bezier(.2,.9,.3,1)}
@keyframes msIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.milestone-ico{font-size:38px;line-height:1}
.milestone-eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ember);margin-top:12px}
.milestone-t{font-size:21px;font-weight:700;letter-spacing:-.025em;margin-top:6px}
.milestone-b{font-size:13.5px;color:var(--text-dim);line-height:1.55;margin:10px auto 0;max-width:34ch}

.ex-kcal{font-size:11px;font-family:var(--fm);color:var(--ember);opacity:.85}

/* editable starting weights */
.seedrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);transition:border-color .18s ease}
.seedrow.edited{border-color:var(--ember-line);background:linear-gradient(180deg,rgba(233,180,76,.06),transparent)}
.seed-wrap{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.seed-field{display:flex;align-items:baseline;gap:5px;border-bottom:1.5px solid var(--line);transition:border-color .18s ease}
.seedrow.edited .seed-field{border-color:var(--ember)}
.seed-in{width:76px;text-align:right;font-family:var(--fm);font-size:20px;font-weight:700;
  letter-spacing:-.02em;background:transparent;border:none;padding:3px 0;color:var(--text)}
.seed-in:focus{outline:none}
.seedrow.edited .seed-in{color:var(--ember)}
.seed-u{font-size:12px;font-weight:600;color:var(--muted)}
.seed-tag{font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.seedrow.edited .seed-tag{color:var(--ember-2)}

/* day rows in the week builder */
.dayrow{
  display:flex;align-items:center;gap:14px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  transition:transform .12s ease,border-color .15s ease;
}
.dayrow:active{transform:scale(.99)}
.dayrow.off{opacity:.5}
.dayrow.past{opacity:.32;pointer-events:none}
.dayrow-d{width:46px;flex:none;text-align:center}
.dayrow-d .n{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--faint)}
.dayrow-d .v{font-size:19px;font-weight:700;font-family:var(--fm);letter-spacing:-.03em;line-height:1.1}
.dayrow-bar{width:3px;align-self:stretch;border-radius:100px;background:var(--surface-3);flex:none}
.dayrow-bar.l3{background:linear-gradient(180deg,var(--ember),var(--ember-2))}
.dayrow-bar.l2{background:var(--ember)}
.dayrow-bar.l1{background:rgba(233,180,76,.5)}
.dayrow-bar.l0{background:var(--surface-3)}

/* ---------- reduced motion ----------
   Someone who has asked their phone to stop animating things has asked for a
   reason. Keep every state change, drop every transition. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .screen{animation:none!important}
  .sheet{transition:none!important}
}
</style>
</head>
