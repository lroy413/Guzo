  background:linear-gradient(180deg,#171c23 60%,rgba(23,28,35,0));
  display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grabber{width:40px;height:4.5px;border-radius:100px;background:var(--surface-3);transition:background .2s ease}
.sheet-grip:active .grabber{background:var(--muted)}
.sheet-x{position:absolute;right:14px;top:5px;width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:all .16s ease}
.sheet-x:active{transform:scale(.9);background:var(--surface-3);color:var(--text)}
.sheet-x svg{width:15px;height:15px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(86px + var(--safe-b) * .5);z-index:200;
  background:var(--surface-3);border:1px solid var(--line);
  padding:12px 18px;border-radius:100px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.3,1);
  max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:rgba(79,209,165,.4);color:var(--teal)}

/* ---------- set logger ----------
   A session is a route with a position on it, not a list of boxes. Three
   states, and they are the ascent's own words: `walked` is behind you, `now` is
   the one you are standing on and is the only full card on the screen, `ahead`
   is a line you can open. The measurement that prompted it: three movements
   came to 1,716px on an 844px screen, one exercise filling the viewport, and
   nine pixels in ten were about a movement you were not doing. */
.ex-card{
  background:linear-gradient(180deg,var(--surface),#10141a);
  border:1px solid var(--line-soft);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:9px;box-shadow:var(--shadow-sm),var(--inset);
  transition:border-color var(--t) ease,background var(--t) ease;
}
/* The one you are on. Lifted off the page by an ember hairline and a warmer
   ground rather than by size — everything around it recedes instead. */
.ex-card.now{
  border-color:rgba(233,180,76,.30);
  background:linear-gradient(180deg,#161b22,#10141a);
  box-shadow:0 10px 30px rgba(0,0,0,.36),var(--inset);
}
.ex-card.fold{background:var(--surface);box-shadow:none;margin-bottom:7px}
.ex-card.fold.walked{border-color:rgba(79,209,165,.16)}
.ex-card.fold.ahead{border-color:var(--line-soft);background:rgba(18,22,28,.55)}
.ex-swap{animation:exIn .26s cubic-bezier(.25,.9,.35,1)}
@keyframes exIn{from{opacity:0;transform:translateY(-4px) scale(.995)}to{opacity:1;transform:none}}

.ex-head{padding:11px 13px;display:flex;align-items:center;gap:10px}
.ex-num-btn{flex:none;display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;margin:-7px}

/* ---------- the node ----------
   A ring that fills with the sets you have ticked, in the thirty pixels the
   flat "01" square used to spend on a number. Same idea as the waypoints on
   Progress: how far in you are should be something you see, not a fraction you
   read. rotate(-90deg) starts it at twelve o'clock. */
.ex-node{position:relative;width:32px;height:32px;flex:none;display:flex;
  align-items:center;justify-content:center}
.ex-ring{position:absolute;inset:0;width:32px;height:32px;transform:rotate(-90deg)}
.ex-ring-t{fill:var(--surface-3);stroke:var(--line);stroke-width:2}
.ex-ring-i{fill:none;stroke:var(--ember);stroke-width:2.6;stroke-linecap:round;
  transition:stroke-dashoffset var(--t) var(--ease-out)}
.ex-node.ok .ex-ring-t{fill:rgba(79,209,165,.14);stroke:rgba(79,209,165,.42)}
.ex-node.ok .ex-ring-i{stroke:var(--teal)}
.ex-node-t{position:relative;font-family:var(--fm);font-size:11.5px;font-weight:700;
  letter-spacing:-.02em;color:var(--muted);line-height:1}
.ex-card.now .ex-node-t{color:var(--ember-2)}
.ex-node.ok .ex-node-t{color:var(--teal)}
.ex-node-t svg{width:15px;height:15px;stroke-width:3;display:block}
/* ---------- who you are (More) ---------- */
.who{display:flex;align-items:center;gap:14px;padding:4px 2px 20px;margin-bottom:2px;
  border-bottom:1px solid var(--line-soft)}
.who-mark{width:54px;height:54px;flex:none;border-radius:18px;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(233,180,76,.20),rgba(233,180,76,.05));
  border:1px solid var(--ember-line);box-shadow:var(--inset)}
.who-name{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.who-sub{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
.who-since{font-size:10.5px;color:var(--faint);text-align:right;flex:none;
  line-height:1.45;letter-spacing:.04em}
.who-since b{color:var(--text-dim);font-weight:650;font-size:11.5px}

/* The link between two movements in the builder. Drawn as a connector rather
   than a row, so it reads as joining the two cards it sits between. */
.rt-link{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;
  margin:-4px 0 9px;padding:0 12px;border:0;background:none;
  font:inherit;font-size:12px;font-weight:600;color:var(--faint);text-align:left;
  transition:color var(--t-fast) ease}
.rt-link-i{width:22px;height:22px;flex:none;border-radius:50%;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.rt-link.on{color:var(--ember-2)}
.rt-link.on .rt-link-i{background:var(--ember-dim);border-color:var(--ember-line);color:var(--ember)}
.rt-link:active .rt-link-i{transform:scale(.9)}
/* Paired items carry the bracket the superset heading uses on Train. */
.rt-item.sup{border-left:2px solid var(--ember-line)}
.rt-sup{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ember-2);
  background:var(--ember-dim);border-radius:5px;padding:2px 6px;margin-left:8px;
  vertical-align:middle}

/* ---------- badges ----------
   A written programme tags its movements so you can read the shape of a
   session without reading every line. Small, quiet, and capped at three. */
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;line-height:1.35;
  background:var(--surface-3);color:var(--muted);border:1px solid transparent}
.badge.ember{background:var(--ember-dim);border-color:var(--ember-line);color:var(--ember-2)}
.badge.teal{background:var(--teal-dim);border-color:rgba(79,209,165,.28);color:var(--teal-soft)}
.badge.sky{background:var(--sky-dim);border-color:rgba(107,168,245,.28);color:#a8caf9}

/* ---------- a superset ----------
   The pair's own heading, sitting inside whatever block it belongs to. The
   bracket down the left is what makes two cards read as one thing. */
.sup-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:14px 2px 8px;padding-left:11px;
  border-left:2px solid var(--ember-line)}
.sup-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ember-2)}
.sup-note{font-size:11.5px;color:var(--muted)}

/* A block heading inside the session. Tighter than a screen section header —
   it separates cards rather than screens. */
.sec-head.blk{margin:20px 2px 9px}
.sec-head.blk:first-child{margin-top:4px}

.ex-more{flex:none;width:44px;height:44px;margin:-7px -6px -7px 0;border-radius:12px;
  border:0;background:none;color:var(--faint);
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t-fast) ease,color var(--t-fast) ease}
.ex-more svg{width:19px;height:19px}
.ex-more:active{background:var(--surface-3);color:var(--text)}
.ex-title{text-align:left;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;padding:4px 0}
.ex-name{font-size:15.5px;font-weight:650;letter-spacing:-.015em;line-height:1.25;display:block}
/* The badges ride on this line rather than in a row under it — a third line of
   text under every exercise name was a third of the head spent on labels. */
.ex-meta{font-size:11.5px;color:var(--faint);margin-top:3px;letter-spacing:.01em;display:block}
.ex-tags{display:inline-flex;gap:5px;margin-left:7px;vertical-align:-1px}
.ex-tags .badge{font-size:9px;padding:2px 6px}
.ex-sum{font-size:12px;color:var(--muted);font-family:var(--fm);letter-spacing:-.01em;display:block;margin-top:2px}
.ex-card.walked .ex-sum{color:var(--teal)}
.ex-flag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ember-2);
  background:var(--ember-dim);border:1px solid var(--ember-line);padding:2px 6px;border-radius:5px;margin-left:7px;vertical-align:middle}
.ex-collapsed{display:flex;align-items:center;gap:10px;width:100%;padding:9px 13px;text-align:left;min-height:56px}
.ex-fold-t{min-width:0;text-align:left}
.ex-card.fold .ex-name{font-size:14.5px;font-weight:600;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-card.fold.walked .ex-name{color:var(--muted)}
.ex-chev{color:var(--faint);flex:none;display:flex;align-items:center}
.ex-chev svg{width:16px;height:16px}

.ex-body{padding:0 12px 10px}

/* ---------- the prescription, on one line ----------
   Was two stacked full-width bars — "Target 20" centred in a padded row and
   "LAST 20 · 3 days ago" in a bordered one under it — above set rows already
   offering 20 in the placeholder. Eighty pixels to print one number three
   times. Chips wrap rather than truncate, and a movement with no target and no
   history draws none of them at all. */
.ex-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 0 8px}
/* A bodyweight movement with no target and no history draws no chips at all,
   and an empty strip must take no room rather than a padded line of it. */
.ex-strip:empty{display:none}
.ex-chip{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;
  border-radius:8px;background:var(--surface-2);border:1px solid var(--hairline);
  min-width:0;max-width:100%}
.ex-chip-k{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);flex:none}
.ex-chip-v{font-size:12.5px;font-weight:650;color:var(--text-dim);letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ex-chip-x{font-size:10.5px;color:var(--faint);flex:none}
.ex-card.now .ex-chip-v{color:var(--text)}
.ex-chip.down{background:var(--amber-dim);border-color:rgba(245,196,81,.26)}
.ex-chip.down .ex-chip-k,.ex-chip.down .ex-chip-x{color:var(--amber)}
.ex-chip.lit .ex-chip-v{color:var(--ember-2)}

/* ---------- how many sets ----------
   Was a full-width "+ Set" as loud as the tick column with a "− Set" beside
   it. Changing the count is a rare correction; it reads as one now. */
.ex-sets{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 0 0}
.ex-step{width:44px;height:40px;border-radius:11px;border:1px solid var(--line-soft);
  background:var(--surface-2);color:var(--text-dim);font-size:19px;font-weight:600;
  line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform var(--t-fast) ease,background var(--t-fast) ease}
.ex-step:active{transform:scale(.92);background:var(--surface-3)}
.ex-step[disabled]{opacity:.34}
.ex-sets-n{font-size:11.5px;color:var(--faint);letter-spacing:.04em;
  min-width:62px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- a set ----------
   Was five columns of a table: a number, three unlabelled boxes and a tick,
   under a repeated uppercase header. It held the right data and read like a
   spreadsheet, on the one screen you use one-handed with a bar on your back.

   The field is the container now, not the input — the unit lives inside it, so
   the label is where you are already looking instead of in a header row above
   every exercise. The tick is wider than everything else because ticking is
   what you are here to do; typing is the exception. */
/* A flex line, not a fixed grid.
   ------------------------------
   The grid named five columns and the row's children varied: a hold adds a run
   button, a run swaps distance for weight, a bodyweight movement has no load
   column at all. The run button was a sixth child, so the tick wrapped to a
   line of its own and a timed set stood 105px tall against everyone else's 54.
   Counting columns out in advance cannot survive a row whose shape depends on
   the movement — which is the general form of the bug, and why the fix is not
   another grid-template. */
.set-row{display:flex;align-items:center;gap:6px;
  padding:3px 2px;border-radius:13px;position:relative;
  transition:background .22s ease}
.set-row.done{background:var(--teal-dim)}
.set-row .sn{flex:none;width:20px;font-size:12.5px;font-weight:700;color:var(--faint);
  text-align:center;font-family:var(--fm);transition:color .2s ease}
.set-row.done .sn{color:var(--teal)}

.set-f{display:flex;align-items:baseline;gap:3px;min-height:44px;padding:0 9px;
  flex:1 1 0;min-width:0;
  border-radius:12px;background:var(--surface-2);border:1px solid transparent;
  transition:border-color .18s ease,background .22s ease}
/* RPE never earns a share of the row — it is a one-digit answer next to two
   that can be three digits and a decimal point. */
.set-f.narrow{flex:none;width:58px;padding:0 7px}
/* focus-within, because the ring belongs to the field and the caret is in the
   input inside it. */
.set-f:focus-within{border-color:var(--ember);background:var(--surface-3)}
.set-in{flex:1;min-width:0;width:100%;background:none;border:0;padding:0;
  text-align:right;font-family:var(--fm);font-weight:650;font-size:16px;
  letter-spacing:-.02em;color:var(--text);transition:color .22s ease}
.set-in::placeholder{color:var(--faint);font-weight:500}
.set-in:focus{outline:none}
.set-u{font-size:10.5px;font-weight:650;color:var(--faint);flex:none;letter-spacing:.02em}
.set-row.done .set-f{background:transparent;border-color:transparent}
.set-row.done .set-in{color:var(--teal-soft)}
.set-row.done .set-u{color:rgba(125,224,192,.6)}
/* RPE off, or a movement with no weight in it, simply drops a child — the flex
   line redistributes on its own and there is no combination of the two to get
   wrong. On a 390px screen a bodyweight movement's reps field goes from about
   94px to about 195px. */

/* ---------- a personal best, in the row it happened in ---------- */
/* Ember over the teal rather than instead of it: the set is still done, and
   this is the one thing in a session you did not already know was coming. */
.set-row.pr{background:var(--ember-dim);box-shadow:inset 0 0 0 1px var(--ember-line)}
.set-row.pr .sn{color:var(--ember)}
.set-row.pr .set-in{color:var(--ember-2)}
.set-row.pr .set-u{color:rgba(233,180,76,.62)}
.set-row .sn svg{width:13px;height:13px;display:block;margin:0 auto}
@media (prefers-reduced-motion: no-preference){
  .set-row.pr .sn svg{animation:prStar .42s var(--ease-spring)}
}
@keyframes prStar{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:none}}

/* ---------- Fuel: the ring, the meals, and a screen that breathes ---------- */
/* Two very low-alpha blooms drifting behind everything. Deliberately under
   0.06 alpha and behind every surface: this app measures text contrast by
   sampling painted pixels, and a bright thing moving under a paragraph would
   change the answer depending on when you looked. Motion you feel rather than
   watch. */
.fuel-aura{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fuel-aura i{position:absolute;display:block;width:min(78vw,340px);height:min(78vw,340px);
  border-radius:50%;filter:blur(58px);opacity:0}
.fuel-aura i:nth-child(1){background:radial-gradient(circle,rgba(233,180,76,.055),transparent 68%);
  top:2%;left:-16%}
.fuel-aura i:nth-child(2){background:radial-gradient(circle,rgba(79,209,165,.05),transparent 68%);
  top:34%;right:-22%}
@media (prefers-reduced-motion: no-preference){
  .fuel-aura i{opacity:1}
  .fuel-aura i:nth-child(1){animation:auraA 34s var(--ease-in-out) infinite alternate}
  .fuel-aura i:nth-child(2){animation:auraB 41s var(--ease-in-out) infinite alternate}
}
@keyframes auraA{from{transform:translate3d(0,0,0)}to{transform:translate3d(16%,10%,0) scale(1.12)}}
@keyframes auraB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-14%,-9%,0) scale(1.08)}}
#s-fuel{position:relative}
#fuel-body{position:relative;z-index:1}

/* The ring. Three concentric arcs — the day, protein, carbs — rather than
   three stacked bars, because a ring reads from across a kitchen and a bar
   chart does not. */
.fuel-ring-wrap{position:relative;width:180px;height:180px;margin:2px auto 4px}
.fuel-ring{width:180px;height:180px;display:block;overflow:visible}
.fr-track{fill:none;stroke:var(--surface-3);stroke-width:11}
.fr-arc{fill:none;stroke-width:11;stroke-linecap:round}
.fr-arc.main{stroke:var(--ember)}
.fr-arc.prot{stroke:var(--teal)}
.fr-arc.carb{stroke:#7aa2d8}
@media (prefers-reduced-motion: no-preference){
  /* Fills from empty on arrival. The delay lets the screen settle first, so it
     reads as the ring filling rather than as the page still loading. */
  .screen.entering .fr-arc{animation:ringIn .9s var(--ease-out) backwards}
  .screen.entering .fr-arc.main{animation-delay:.06s}
  .screen.entering .fr-arc.prot{animation-delay:.14s}
  .screen.entering .fr-arc.carb{animation-delay:.22s}
  .fr-arc{transition:stroke-dashoffset .6s var(--ease-out)}
}
@keyframes ringIn{from{stroke-dashoffset:var(--c,500)}}
.fuel-ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none}
.fuel-ring-v{font-size:38px;font-weight:700;letter-spacing:-.045em;line-height:1;
  color:var(--text);font-variant-numeric:tabular-nums}
.fuel-ring-k{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:5px}
.fuel-ring-of{font-size:11.5px;color:var(--faint);margin-top:3px}

/* ---------- the day as a fire ----------
   The other face of the same three numbers. See fireGaugeHTML() for why the
   layers are concentric, why they are not clamped to each other, and why it is
   never out.

   Three fire colours rather than the rings' three hues, which is what was
   asked for and is also the only way a stack of flames reads as ONE fire:
   ember at the envelope, amber through the body, near-white at the core. They
   are ordered by heat, so the eye reads depth rather than three overlapping
   shapes — and each stays distinguishable from the one under it, which a
   single hue at three opacities does not. */
/* 132 tall, not the ring's 180. The viewBox is cropped to where the fire
   actually lives — even at full burn the tallest flame tops out around y=57 of
   180, so a square box left a third of the card empty above an unfed fire and
   made the low states look like a mistake. Cropped, the fire is bottom-anchored
   in its frame and grows up into it, which is the thing being drawn. */
.fuel-fire-wrap{position:relative;width:180px;height:132px;margin:6px auto 0}
.fuel-fire{position:relative;width:180px;height:132px;display:block;overflow:visible}
.ff-bed{fill:#2A1508;opacity:.85}
/* Each layer is a two-hop ramp from its own hot base to its own crown. The
   stops are classes rather than inline stop-colors so the whole palette sits
   here with the rest of the colour, and each layer's crown is the next one
   out's base — which is what makes three of them read as depth in one fire
   rather than as three flames standing in a row. */
.ff-flame{fill-opacity:.94}
.ff-out{fill-opacity:.74}
.ff-mid{fill-opacity:.9}
/* The middle stop of each ramp IS that layer's token, so the colour the legend
   shows for a macro is literally the colour of the flame it names. */
#ff-out-g .ff-s0{stop-color:#FF9038}
#ff-out-g .ff-s1{stop-color:var(--ff-out)}
#ff-out-g .ff-s2{stop-color:#B02C0D}
#ff-mid-g .ff-s0{stop-color:#FFD37A}
#ff-mid-g .ff-s1{stop-color:var(--ff-mid)}
#ff-mid-g .ff-s2{stop-color:#F26F1C}
#ff-core-g .ff-s0{stop-color:#FFFCEC}
#ff-core-g .ff-s1{stop-color:var(--ff-core)}
#ff-core-g .ff-s2{stop-color:#FFC24A}
/* Which flame is which, said where the numbers are read rather than in a
   caption on the drawing. Scoped to the card, and only when the fire is what
   is being shown — the rings keep the macro hues they have always had, which
   are the colours of the arcs and would be a lie next to a fire. */
.fuel-day-card.viz-fire .fuel-dot.prot{background:var(--ff-mid)}
.fuel-day-card.viz-fire .fuel-leg.prot .fuel-leg-bar i{background:var(--ff-mid)}
.fuel-day-card.viz-fire .fuel-dot.carb{background:var(--ff-core)}
.fuel-day-card.viz-fire .fuel-leg.carb .fuel-leg-bar i{background:var(--ff-core)}
/* Calories has no legend row — it is the big number — so its key rides in
   front of the unit. A swatch rather than a coloured label: --ff-out is a deep
   ember, which is right for the outermost flame against a dark page and would
   be under 4.5:1 as 10.5px uppercase text. A graphic carries the identity at
   3:1 and the word stays the colour it was measured at. */
.fuel-key{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:baseline;background:var(--ff-out)}
.ff-spark{fill:#FFD98A;opacity:0}
/* Behind the flames and outside the SVG, so it cannot be clipped by a viewBox
   the tallest flame already fills. Scaled by the wrap rather than by a value
   per layer: one fire, one pool of light. */
.fuel-fire-glow{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
  width:190px;height:126px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 62%,rgba(255,150,54,.30) 0%,rgba(255,120,40,.10) 46%,rgba(255,110,40,0) 72%)}
.fuel-fire-wrap.lit .fuel-fire-glow{
  background:radial-gradient(50% 50% at 50% 62%,rgba(255,170,70,.46) 0%,rgba(255,130,45,.17) 46%,rgba(255,110,40,0) 74%)}
/* The number sits under the fire rather than in it. A ring has a hole in the
   middle and a fire has its brightest part exactly there — text over the core
   is either unreadable or forces the core dark, and the core is the point. */
.fuel-fire-read{display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;margin-top:-6px}

@media (prefers-reduced-motion: no-preference){
  /* Growth is a transition on the path, so adding a food makes the fire climb
     rather than cut. `d` is animatable on a path in every engine this ships to,
     and the shape is regenerated from the same function at the new height, so
     the two ends of the transition are the same curve at different sizes —
     which is what makes it interpolate cleanly instead of writhing. */
  .ff-flame{transition:d .55s var(--ease-out),fill-opacity .55s var(--ease-out)}
  /* Three rates, none dividing into another, so the fire never repeats a pose
     on a countable beat — the camp fire's rule, and the reason it is watchable
     rather than a blinking element. transform-box because an SVG path's origin
     is the viewport corner by default, so without it the flames slide off the
     logs instead of licking up from them. */
  .ff-flame{transform-box:fill-box;transform-origin:50% 100%}
  .ff-out{animation:ffLick 4.3s ease-in-out infinite}
  .ff-mid{animation:ffLick 2.9s ease-in-out infinite reverse}
  .ff-core{animation:ffLick 3.7s ease-in-out infinite}
  .fuel-fire-glow{animation:ffGlow 6.5s ease-in-out infinite}
  @keyframes ffLick{
    0%,100%{transform:scale(1,1)}
    30%{transform:scale(.94,1.07)}
    62%{transform:scale(1.05,.95)}
  }
  @keyframes ffGlow{0%,100%{opacity:1}45%{opacity:.74}70%{opacity:.92}}
  /* Reaching all three targets makes it burn harder, not throw a party. The
     rates shorten and the sparks start; nothing flashes, nothing bounces, and
     no copy congratulates you. The fire is bigger because you fed it. */
  .lit .ff-out{animation-duration:3.1s}
  .lit .ff-mid{animation-duration:2.1s}
  .lit .ff-core{animation-duration:2.6s}
  /* Long and out of step, so one drifts up every few seconds rather than four
     going together on a beat. The keyframe spends most of its length at zero
     opacity — that is the waiting, and it is why the periods are this long:
     a spark is an event, and an event on a two-second loop is a pulse. */
  .fuel-fire .ff-spark{transform-box:fill-box;transform-origin:50% 50%;
    animation:ffSpark 9s ease-out infinite}
  .ff-spark:nth-of-type(2){animation-duration:11.5s;animation-delay:2.6s}
  .ff-spark:nth-of-type(3){animation-duration:13.5s;animation-delay:5.1s}
  .ff-spark:nth-of-type(4){animation-duration:10.5s;animation-delay:7.4s}
  /* Reaching all three makes them frequent, not present. */
  .lit .ff-spark{animation-duration:3.4s}
  .lit .ff-spark:nth-of-type(2){animation-duration:4.3s;animation-delay:.9s}
  .lit .ff-spark:nth-of-type(3){animation-duration:3.8s;animation-delay:1.9s}
  .lit .ff-spark:nth-of-type(4){animation-duration:4.8s;animation-delay:2.7s}
  @keyframes ffSpark{
    0%{opacity:0;transform:translateY(4px) scale(.5)}
    6%{opacity:.95;transform:translateY(0) scale(1)}
    34%{opacity:0;transform:translateY(-42px) scale(.3)}
    100%{opacity:0;transform:translateY(-42px) scale(.3)}
  }
}

.fuel-burn-chip{display:block;width:fit-content;margin:2px auto 0;font-size:11.5px;
  color:var(--ember-2);background:var(--ember-dim);border:1px solid var(--ember-line);
  border-radius:999px;padding:4px 11px}
.fuel-burn-chip .mono{font-weight:700}

.fuel-legend{display:flex;flex-direction:column;gap:2px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line-soft)}
.fuel-leg{display:flex;align-items:center;gap:9px;min-height:30px;font-size:13.5px;
  font-weight:600;letter-spacing:-.01em}
.fuel-leg .mono{font-size:13px;color:var(--text)}
.fuel-of-s{color:var(--faint);font-weight:500}
.fuel-dot{width:9px;height:9px;border-radius:50%;flex:none}
.fuel-dot.prot{background:var(--teal)}
.fuel-dot.carb{background:#7aa2d8}
.fuel-dot.fat{background:var(--surface-3);box-shadow:inset 0 0 0 1.5px var(--line)}

/* A day has a shape: breakfast, lunch, dinner, what you picked at. */
.fuel-meal{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-l);margin-bottom:10px;overflow:hidden}
.fuel-meal-h{display:flex;align-items:center;gap:9px;padding:9px 14px;
  background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.fuel-meal-i{color:var(--ember);font-size:13px;flex:none}
.fuel-meal-n{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted)}
.fuel-meal-s{font-size:12px;color:var(--text);font-weight:650}
.fuel-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px 10px 14px;min-height:52px;background:none;border:0;
  border-top:1px solid var(--line-soft);color:var(--text)}
.fuel-item:first-of-type{border-top:0}
.fuel-item:active{background:var(--surface-2)}
.fuel-item-n{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.fuel-item-b{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.fuel-own{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ember-2);background:var(--ember-dim);border-radius:999px;
  padding:1px 6px;margin-left:6px;vertical-align:1px}

.fuel-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}

/* ---------- the day's work, already done ---------- */
/* Teal rather than ember: everywhere else in the app ember means "this is next"
   and teal means "this is done", and the whole complaint was that a finished
   day looked exactly like an unstarted one. */
.done-card{border-color:rgba(79,209,165,.28);background:linear-gradient(180deg,rgba(79,209,165,.06),transparent 60%)}
.tealtone{color:var(--teal)}
.done-stats{display:flex;gap:20px;flex-wrap:wrap}
.done-v{font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1;
  color:var(--text);font-variant-numeric:tabular-nums}
.done-k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-top:4px}

/* ---------- the scanner ---------- */
.fuel-scan-btn{flex:none;width:56px;padding:0;display:flex;align-items:center;justify-content:center}
.fuel-scan-btn svg{width:22px;height:22px}
.scan-stage{position:relative;border-radius:var(--r-l);overflow:hidden;background:#000;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.scan-stage video{width:100%;height:100%;object-fit:cover;display:block}
/* Four corners rather than a full rectangle: a closed box invites you to fill
   it edge to edge, and a barcode read at the very edge of the frame is the one
   that will not decode. */
.scan-frame{position:absolute;left:9%;right:9%;top:29%;bottom:29%;pointer-events:none}
.scan-frame i{position:absolute;width:26px;height:26px;border:2.5px solid rgba(255,255,255,.92);
  border-radius:3px}
.scan-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.scan-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.scan-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.scan-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.scan-line{position:absolute;left:5px;right:5px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--ember),transparent);opacity:.9}
@media (prefers-reduced-motion: no-preference){
  .scan-line{animation:scanSweep 2.4s var(--ease-in-out) infinite alternate}
}
@keyframes scanSweep{from{transform:translateY(-44px)}to{transform:translateY(44px)}}
.scan-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;
  font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.85)}
.scan-code{font-size:20px;font-weight:700;letter-spacing:.06em;text-align:center;
  color:var(--ember-2);background:var(--ember-dim);border:1px solid var(--ember-line);
  border-radius:var(--r-l);padding:12px}

/* ---------- import ---------- */
.imp-drop{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:26px 18px;border-radius:var(--r-l);cursor:pointer;
  background:var(--surface-2);border:1.5px dashed var(--ember-line);text-align:center}
.imp-drop:active{background:var(--surface-3)}
.imp-drop-i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--ember-dim);color:var(--ember);margin-bottom:4px}
.imp-drop-i svg{width:21px;height:21px}
.imp-drop-t{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.imp-drop-b{font-size:12px;color:var(--muted)}

.imp-sum{display:flex;align-items:center;gap:14px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r-l);padding:14px 16px}
.imp-sum-n{font-family:var(--fm);font-size:30px;font-weight:700;color:var(--ember);
  letter-spacing:-.04em;line-height:1;min-width:34px;text-align:center}
.imp-sum-t{font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.imp-sum-b{font-size:12px;color:var(--muted);margin-top:2px}

.imp-day{border:1px solid var(--line-soft);border-radius:var(--r-l);overflow:hidden;
  margin-bottom:10px;background:var(--surface)}
.imp-day.off{opacity:.5}
.imp-day-h{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
  padding:11px 14px;background:var(--surface-2);border:0;text-align:left;color:var(--text)}
.imp-day-t{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.015em}
.imp-day-b{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

.imp-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px 9px 10px;
  border-top:1px solid var(--line-soft)}
.imp-item.off .imp-body{opacity:.42}
/* Ember for a match worth a second look, rose for one that could not be made
   at all — the two need to be told apart at a glance in a list of fifty. */
.imp-item.unsure{background:rgba(233,180,76,.055)}
.imp-item.miss{background:rgba(242,114,111,.06)}
.imp-tick{width:30px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:none;border:0;padding:0;color:var(--faint)}
.imp-tick svg{width:17px;height:17px;stroke-width:2.6;opacity:.28}
.imp-tick.on{color:var(--teal)}
.imp-tick.on svg{opacity:1}
.imp-tick:active{transform:scale(.9)}
.imp-body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:2px 0;color:var(--text)}
.imp-name{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.imp-item.miss .imp-name{color:var(--rose)}
.imp-from{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;
  font-size:11.5px;color:var(--faint)}
.imp-tag{font-size:10.5px;font-weight:650;letter-spacing:.03em;padding:2px 7px;
  border-radius:999px;background:var(--surface-3);color:var(--muted)}
.imp-tag.warn{background:var(--ember-dim);color:var(--ember-2)}
.imp-item.miss .imp-tag.warn{background:var(--rose-dim);color:var(--rose)}

/* ---------- the records from a finished session ---------- */
.prs{background:var(--ember-dim);border:1px solid var(--ember-line);
  border-radius:var(--r-l);padding:13px 15px}
.prs-h{display:flex;align-items:center;gap:8px;color:var(--ember);
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.prs-h svg{width:14px;height:14px;flex:none}
.prs-row{display:flex;align-items:center;gap:12px;min-height:32px;
  font-size:14px;font-weight:600;letter-spacing:-.01em;padding-top:7px}
.prs-row .mono{color:var(--ember-2);font-size:13px;flex:none}

/* ---------- the session rail ----------
   A segment per movement, filling as its sets are ticked.

   Pinned to the top of the scroller, because "where am I" is the question you
   have while you are scrolling and the answer was scrolling away with you. The
   band behind it is painted with the page's own --bg-grad at
   background-attachment:fixed, exactly as .hdr is: attached to the viewport it
   lands on the same part of the gradient as the page under it, so it is opaque
   to what passes beneath and invisible against the sky in all four data-sky
   bands. A flat colour would be right in one band and wrong in three.

   top:0, not top:var(--safe-t) — .screen is already padded past the notch and
   the rectangle a sticky offset is measured from is inset by that padding, so
   counting it again parks the bar a hundred pixels down a real iPhone.

   And a sticky top:0 sits at the top of the scroller's CONTENT box, not its
   padding box — measured: the bar stopped 14px down and "185 lb reps rpe" from
   the row above stayed legible in the strip over it. So the band is padded up
   through that strip and pulled back by an equal negative top, which cancels
   when it is stuck; the margin cancels the padding when it is not. Both halves
   are needed. Padding alone moves where the card lands when stuck but not
   where it starts, and the card jumps the moment you scroll; a taller band
   alone paints over the screen title at rest, which clipped the descender of
   "Full body". The strip is a safe-area inset plus the screen's own padding,
   so a desktop browser — where the inset is 0px — cannot show you either half
   going wrong. */
.tr-pin{--tr-strip:calc(var(--safe-t) + 14px);
  position:sticky;top:calc(-1 * var(--tr-strip));z-index:14;
  margin:calc(-1 * var(--tr-strip)) -16px 12px;padding:var(--tr-strip) 16px 8px;
  background:var(--bg-grad);background-attachment:fixed}
.tr-pin>.card{margin-bottom:0}

/* ---------- the top of the route ----------
   The same peak the ascent on Progress summits with. A session and a milestone
   are the same shape of thing and the app should not hold two ideas about what
   the top looks like. */
.tr-summit{position:relative;margin-top:22px;padding:16px 14px 14px;
  border-radius:var(--r-lg);text-align:center;
  background:linear-gradient(180deg,rgba(233,180,76,.05),transparent 62%);
  border:1px solid var(--line-soft)}
.tr-summit.reached{border-color:var(--ember-line);
  background:linear-gradient(180deg,rgba(233,180,76,.13),transparent 68%)}
.tr-peak{display:block;width:52px;height:34px;margin:0 auto 9px}
.tr-peak-f{fill:var(--surface-3);stroke:var(--line);stroke-width:1}
.tr-peak-s{fill:var(--ember);opacity:.45}
.tr-summit.reached .tr-peak-f{fill:#242c37;stroke:var(--ember-line)}
.tr-summit.reached .tr-peak-s{opacity:1}
.tr-summit-t{font-size:12.5px;color:var(--muted);letter-spacing:.03em;margin-bottom:12px}
.tr-summit.reached .tr-summit-t{color:var(--ember-2)}

/* The bar reads as 8px and the button *is* 44px: the track is drawn by a
   pseudo-element centred inside a full-height target, and the surrounding
   negative margin gives the row back the space it does not need to show.
   A transparent ::after pad would have extended the tap area without extending
   the box — which looks identical, passes by eye, and measures as an 8px
   target. blanks.mjs caught exactly that on the first attempt. */
/* ---------- the range ----------
   The mountains that stand behind the ascent on Progress, at the top of Train,
   revealing themselves as you work: a movement owns a slice of the horizon
   equal to its sets over the session's sets, and lights that slice in
   proportion to its own ticks.

   Full-bleed to the card's edges, and the rail sits on its baseline as the
   trail along the foot of the range. */
.tr-head{position:relative;overflow:hidden;padding-top:0}
.tr-range{position:relative;height:62px;margin:0 -15px 2px;pointer-events:none}
.tr-range svg{display:block;width:100%;height:100%}
/* Before you start: there, and only just. */
.tr-f1{fill:#151b24}
.tr-f2{fill:#11161d}
.tr-f3{fill:#0d1116}
.tr-e{fill:none;stroke:#232b36;stroke-width:1}
/* With the light on it. The mass warms a little; it is the ridgelines catching
   the sun that do the work — a dark mountain with a lit edge is the picture,
   and filling the mass alone reads as a bar chart with peaks on it. */
.tr-w1{fill:url(#tr-sky)}
.tr-w2{fill:#232c39}
.tr-w3{fill:#171e28}
.tr-l1{fill:none;stroke:var(--ember);stroke-width:1.2;opacity:.5}
.tr-l2{fill:none;stroke:var(--ember-2);stroke-width:1.3;opacity:.65}
.tr-l3{fill:none;stroke:var(--ember-2);stroke-width:1.7;opacity:.95}
.tr-div path{fill:none;stroke:rgba(255,255,255,.10);stroke-width:1}
@media (prefers-reduced-motion: no-preference){
  .tr-range rect{transition:x var(--t-slow) var(--ease-out),width var(--t-slow) var(--ease-out)}
  .tr-you{transition:left var(--t-slow) var(--ease-out),top var(--t-slow) var(--ease-out)}
}
/* Standing on the skyline. Drawn in HTML, not in the SVG — that one is
   preserveAspectRatio="none", so anything round inside it comes out an ellipse
   whose eccentricity depends on the width of the phone. */
.tr-you{position:absolute;width:9px;height:9px;border-radius:50%;
  background:var(--ember-2);transform:translate(-50%,-50%);
  box-shadow:0 0 0 2.5px rgba(10,12,15,.9),0 0 12px 2px rgba(244,208,140,.6)}
/* The light on the range, carried by the marker rather than by a shape inside
   the SVG — see the note there. */
.tr-you::before{content:'';position:absolute;left:50%;top:50%;width:86px;height:86px;
  margin:-43px 0 0 -43px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(244,208,140,.20),rgba(244,208,140,0) 68%)}

/* The band reads as 5px and the button *is* 44px: the track is a
   pseudo-element centred inside a full-height target, and the negative margin
   gives back the space it does not need to show. A transparent pad would have
   extended the tap area without extending the box — identical by eye, and 5px
   to a measurement. */
.rail{display:flex;gap:4px;align-items:stretch;height:44px;margin:-14px -3px -15px;position:relative}
.rail-seg{flex:1 1 0;min-width:6px;padding:0;border:0;background:none;position:relative}
.rail-seg::before{content:'';position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);height:5px;border-radius:100px;
  background:rgba(255,255,255,.07);transition:background .2s ease}
.rail-seg i{position:absolute;left:0;top:50%;transform:translateY(-50%);height:5px;
  border-radius:100px;background:var(--ember);transition:width .34s var(--ease-out)}
.rail-seg.done i{background:var(--teal)}
/* Purely a gap. flex:none so it never steals width from a movement, and the
   rail's own 4px gap sits on both sides of it, which is what makes the break
   read at a glance without a visible rule. */
.rail-brk{flex:none;width:1px;align-self:center;height:12px;
  background:var(--line);border-radius:1px}
/* The movement you are on used to grow to flex 2.1 to stand out. It cannot any
   more: the range above divides on the same shares, and a segment that widened
   itself would slide out from under its own mountain. It is lit instead. */
.rail-seg.now::before{background:rgba(233,180,76,.24)}
.rail-seg.now i{box-shadow:0 0 10px 1px rgba(233,180,76,.5)}
.rail-seg:active::before{background:var(--line)}
.tick{flex:none;width:58px;height:44px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--faint);
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .12s ease}
.tick:active{transform:scale(.9)}
.tick.on{background:rgba(79,209,165,.9);border-color:transparent;color:#06251d}
.tick svg{width:16px;height:16px;stroke-width:3.2}
/* The single most repeated interaction in the app gets the one piece of
   deliberate delight in it. Driven by a transient class from the handler
   rather than by `.on`, so it fires when you tick a set and not every time a
   card re-renders with sets already ticked — a screen that pops eight times
   on arrival is a nervous tic, not a flourish. */
@media (prefers-reduced-motion:no-preference){
  .tick.pop{animation:tickPop .34s var(--ease-spring)}
  .tick.pop svg{animation:tickDraw .3s var(--ease-out)}
}
@keyframes tickPop{0%{transform:scale(.86)}55%{transform:scale(1.09)}100%{transform:none}}
@keyframes tickDraw{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
.ghost-note{font-size:11.5px;color:var(--faint);font-family:var(--fm);text-align:center;padding:2px 0 6px}

/* ---------- rest timer ---------- */
.rest{
  /* Tracks the nav: 60px of pill, its own 8px + half-inset offset, and 8px
     between the two. Written with the same half-inset as the nav, or the two
     drift apart the moment either is retuned and the timer floats. */
  position:fixed;left:var(--sp);right:var(--sp);bottom:calc(76px + var(--safe-b) * .5);z-index:70;
  background:rgba(22,27,34,.82);backdrop-filter:blur(24px) saturate(1.5);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(233,180,76,.24);
  border-radius:18px;padding:11px 13px 12px 16px;display:none;
  box-shadow:var(--shadow),var(--inset);max-width:608px;margin:0 auto;
  animation:restIn .3s cubic-bezier(.2,.9,.3,1);
}
.rest.on{display:block}
.rest-row{display:flex;align-items:center;gap:13px;margin-bottom:9px}
@keyframes restIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* The bar runs the full width now rather than sharing a row with the label —
   it is the only thing on screen that is moving, and it reads as a distance
   left to cover instead of a detail beside the number. */
.rest .bar.thin{height:4px}
.rest .t{font-family:var(--fm);font-size:26px;font-weight:700;letter-spacing:-.035em;
  color:var(--ember);min-width:72px;font-variant-numeric:tabular-nums;line-height:1}
.rest-label{font-size:12.5px;font-weight:650;color:var(--text);letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* What the wait is for. Without it the bar is time passing and nothing else. */
.rest-next{font-size:11.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest-next b{color:var(--ember-2);font-weight:650}
.rest-next:empty{display:none}
/* The same bar counting work rather than rest. Teal, because everywhere else
   in the app teal means "this is the doing part" and ember means "waiting". */
.rest.work{border-color:rgba(79,209,165,.34)}
.rest.work .t{color:var(--teal)}
.rest.work .bar i{background:var(--teal)}

/* ---------- charts ---------- */
.chart{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.chart .b{flex:1;background:linear-gradient(180deg,var(--ember),rgba(233,180,76,.25));border-radius:5px 5px 2px 2px;min-height:3px;position:relative;transition:height .5s ease}
.chart .b.dim{background:linear-gradient(180deg,var(--surface-3),var(--surface-2))}
.chart-x{display:flex;gap:5px;margin-top:7px}
.chart-x span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.spark{width:100%;height:56px;display:block}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:9px}
.rung{display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);transition:all .15s ease}
.rung:active{transform:scale(.985)}
.rung.on{border-color:var(--ember-line);background:linear-gradient(90deg,rgba(233,180,76,.11),rgba(233,180,76,.02))}
.rung .n{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--surface-3);color:var(--muted);font-family:var(--fm)}
.rung.on .n{background:var(--ember);color:#1F1704}

/* ---------- week strip ---------- */
.week{margin-bottom:12px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
/* The header of the strip: arrows either side of the week's name. Baseline
   alignment is wrong here — .sec-head aligns to baseline for text, and a
   square button has none worth aligning to — so this row re-centres itself. */
.wk-head{display:flex;align-items:center;gap:2px}
.wk-nav{width:44px;height:44px;margin:-11px 0;flex:none;border-radius:50%;
  background:transparent;border:0;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s ease}
.wk-nav svg{width:15px;height:15px}
.wk-nav:active:not(.is-off){background:var(--surface-2);color:var(--text)}
/* Kept in the flow rather than hidden, so the label does not jump sideways
   when you reach the end of the range. */
.wk-nav.is-off{opacity:.22}
.day{padding:11px 3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center;transition:all .15s ease;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day.today{border-color:var(--ember-line)}
.day.done{background:var(--teal-dim);border-color:rgba(79,209,165,.35)}
.day.rest{opacity:.5}
/* Deliberately NOT red. A day that didn't happen is neutral information,
   not a failure state — the whole premise falls apart if we punish it. */
.day.miss{border-style:dashed;border-color:var(--line);background:transparent;opacity:.62}
.day .dn{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em}
.day .dd{font-size:15px;font-weight:700;font-family:var(--fm)}
.day .dt{font-size:11px;color:var(--muted);font-weight:600;line-height:1.1}
.day.done .dt{color:var(--teal)}

/* ---------- misc ---------- */
.banner{padding:14px 16px;border-radius:var(--r);font-size:14px;line-height:1.5;border:1px solid}
.banner.info{background:var(--sky-dim);border-color:rgba(107,168,245,.3);color:#c3dcff}
.banner.warm{background:var(--ember-dim);border-color:var(--ember-line);color:#ffd3b3}
.banner.good{background:var(--teal-dim);border-color:rgba(79,209,165,.3);color:#b6f0dc}
.banner.soft{background:var(--surface-2);border-color:var(--line);color:var(--text-dim)}
.src{font-size:11px;color:var(--faint);font-style:italic;margin-top:7px;display:block}
/* Namespaced, and deliberately. As a bare `.empty` this was a one-word class
   that any component's own "empty" modifier inherited by accident — .day-v.empty
   picked up its 44px padding and grew from 23px to 88px, which is what pushed
   the Steps label two-thirds of the way down the strip. Component classes in
   this file are namespaced by feature; this one was the exception. */
.blankstate{text-align:center;padding:44px 20px;color:var(--muted)}
.blankstate .big{font-size:34px;margin-bottom:12px;opacity:.5}
.pro-tag{font-size:11px;font-weight:700;letter-spacing:.09em;padding:2px 6px;border-radius:5px;background:var(--ember-dim);color:var(--ember-2);border:1px solid var(--ember-line);vertical-align:middle}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted);transition:all .15s ease}
.seg button.on{background:var(--surface-3);color:var(--text)}
/* A two-way switch inside a builder row. Still 44px tall — it is the control
   that decides whether a movement is counted in reps or in seconds, and it
   sits under a thumb mid-edit like everything else here. */
.seg.sm button{min-height:44px;padding:6px;font-size:12.5px}

/* ---------- the circuit runner ---------- */
.circ-top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.circ-round{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ember)}
.circ-count{font-size:12.5px;color:var(--muted)}
.circ-now{background:var(--surface-2);border:1px solid var(--ember-line);border-radius:var(--r-l);
  padding:18px 16px 16px;margin-bottom:14px}
.circ-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px}
.circ-name{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.circ-amt{font-size:15px;color:var(--ember);font-weight:650;margin-top:6px}
.circ-next{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.45}
.circ-next strong{color:var(--text);font-weight:650}

.circ-list{background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:12px 13px}
.circ-list-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.circ-pips{display:flex;gap:5px}
.circ-pip{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}
.circ-pip.on{background:var(--ember)}
.circ-pip.full{background:var(--teal)}
.circ-row{display:flex;align-items:center;gap:11px;padding:9px 2px;min-height:44px;
  border-top:1px solid var(--line-soft)}
.circ-row:first-of-type{border-top:0}
.circ-row-n{font-size:14px;font-weight:600;letter-spacing:-.01em}
.circ-row-a{font-size:12.5px;color:var(--muted);flex:none}
/* Deliberately only a ring until it is filled — a row you have not reached is
   information, not an empty box asking to be ticked. */
.circ-dot{width:20px;height:20px;flex:none;border-radius:50%;border:1.6px solid var(--surface-3);
  display:flex;align-items:center;justify-content:center;color:#0F1216}
.circ-dot svg{width:12px;height:12px}
.circ-row.is-done .circ-dot{background:var(--teal);border-color:var(--teal)}
.circ-row.is-done .circ-row-n{color:var(--muted)}
.circ-row.is-now{margin:0 -13px;padding-left:15px;padding-right:15px;background:var(--surface-3)}
.circ-row.is-now .circ-dot{border-color:var(--ember)}
.circ-row.is-now .circ-row-n{color:var(--text);font-weight:700}
/* ============================================================
   HOME DASHBOARD
   ============================================================ */
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:2px 0 20px}
.home-greet{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.home-date{font-size:12.5px;color:var(--faint);margin-top:4px;letter-spacing:.02em}
/* The after-midnight note. Tappable — it is also the way to the setting that
   put it there — so it carries a full touch target without looking like a
   button, because it is a statement first.

   The target is bought with padding below rather than negative margins above.
   The first version pulled itself up 11px to absorb its own touch target and
   landed its 44px box on top of the date line — invisible at this font size
   and this colour, and a real overlap. Two text nodes must never share a box
   just because one of them is quiet enough to get away with it. */
.home-late{display:inline-flex;align-items:flex-start;min-height:44px;padding:6px 0 0;
  margin:0 0 -8px;
  font:inherit;font-size:12px;font-weight:650;color:var(--ember);
  background:none;border:0;text-align:left;letter-spacing:.01em}
.streak-chip{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:14px;flex:none;
  background:linear-gradient(180deg,rgba(233,180,76,.13),rgba(233,180,76,.04));
  border:1px solid var(--ember-line);box-shadow:var(--inset)}
.streak-n{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--ember);letter-spacing:-.04em;line-height:1}
.streak-l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.25}

/* hero */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:12px;
  background:linear-gradient(165deg,#1b212a 0%,#12171d 58%,#0f1318 100%);
  border:1px solid rgba(233,180,76,.22);
  box-shadow:0 20px 46px rgba(0,0,0,.42),var(--inset)}
.hero.quiet{border-color:var(--line-soft);background:linear-gradient(165deg,#171b21,#0f1318)}
.hero.done{border-color:rgba(79,209,165,.26);background:linear-gradient(165deg,#152220,#0f1318)}
.hero-glow{position:absolute;inset:-40% -20% auto -20%;height:70%;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 0%,rgba(233,180,76,.18),transparent 70%)}
/* The range stands behind the day's session the way it stands behind the
   ascent on Progress. Shorter and softer here than on Train, because there is
   34px type sitting on top of it. */
.hero .ridge{height:132px;opacity:.72}
.hero .ridge svg{opacity:.9}
.hero.done .ridge-line{stroke:var(--teal-soft)}
.hero.quiet .ridge{opacity:.4}
.hero-in{position:relative;padding:20px 20px 18px}
.hero-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ember-2);
  display:inline-flex;align-items:center;gap:7px}
.hero-eyebrow.tl{color:var(--teal)}
.hero-tag{font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.06);color:var(--muted);margin-left:5px}

/* training header — leaving is a first-class action, discarding is not */
.train-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.train-back{width:44px;height:44px;border-radius:12px;flex:none;margin-left:-6px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);
  transition:all .16s ease}
.train-back:active{transform:scale(.92);background:var(--surface-3)}
.train-back svg{width:19px;height:19px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ember);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.hero-title{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin:12px 0 0}
.hero-sub{font-size:13.5px;color:var(--muted);line-height:1.5;margin:14px 0 0}
.hero-meta{display:flex;align-items:center;gap:14px;margin-top:16px}
.hm{display:flex;flex-direction:column;gap:3px}
.hm-v{font-family:var(--fm);font-size:16px;font-weight:700;letter-spacing:-.025em;color:var(--text)}
.hm-k{font-size:9.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.hm-div{width:1px;height:26px;background:var(--hairline)}
.hero-stats{display:flex;gap:22px;margin-top:16px}
.hero-stats > div{display:flex;flex-direction:column;gap:2px}
.hs-v{font-family:var(--fm);font-size:24px;font-weight:700;letter-spacing:-.04em;color:var(--teal);line-height:1}
.hs-k{font-size:9.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.hero .btn.quiet{margin-top:2px}

/* readiness strip */
.strip{display:flex;align-items:center;gap:14px;width:100%;padding:13px 15px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--inset);
  transition:transform .12s ease,border-color .18s ease}
.strip:active{transform:scale(.99)}
.strip.cta{border-color:var(--ember-line);background:linear-gradient(180deg,rgba(233,180,76,.07),transparent)}
.strip-ico{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ember-dim);color:var(--ember);font-size:17px}
.strip-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.strip-s{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.35}
.strip-chev{color:var(--faint);font-size:19px;flex:none}
.ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface-3);stroke-width:3}
.ring-fg{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,0,.2,1)}
.ring-fg.teal{stroke:var(--teal)}.ring-fg.amber{stroke:var(--amber)}
.ring-fg.rose{stroke:var(--rose)}.ring-fg.muted{stroke:var(--muted)}
.ring-t{transform:rotate(90deg);transform-origin:18px 18px;text-anchor:middle;font-size:11px;
  font-weight:700;fill:var(--text);font-family:var(--fm)}

/* contextual notes */
.note{padding:15px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--inset)}
.note.warm{border-color:var(--ember-line);background:linear-gradient(180deg,rgba(233,180,76,.06),transparent)}
.note.sky{border-color:rgba(107,168,245,.26);background:linear-gradient(180deg,rgba(107,168,245,.06),transparent)}
.note-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em;margin:0}
.note-b{font-size:13px;color:var(--muted);line-height:1.5;margin:7px 0 0}

/* section headers */
.sec-head{margin-top:26px;display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 11px}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.sec-a{font-size:12.5px;font-weight:650;color:var(--ember);letter-spacing:-.01em;
  padding:11px 4px;margin:-11px -4px;min-height:44px;display:inline-flex;align-items:center}

/* the creed — a designed sign-off, not stray italics */
.creed{margin:36px 0 6px;text-align:center;padding:0 8px}
.creed-rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.creed-mark{display:block;font-family:ui-serif,Georgia,'Times New Roman',serif;font-size:44px;
  line-height:1;color:var(--ember);opacity:.5;margin:20px 0 -10px}
.creed-text{font-family:ui-serif,Georgia,'Times New Roman',serif;font-size:18.5px;line-height:1.5;
  letter-spacing:-.01em;color:var(--text-dim);margin:0 auto;max-width:26ch;font-weight:400}
.creed-tag{display:block;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--faint);margin:18px 0 20px}

/* onboarding scale preview */
.scale-grid{display:flex;flex-direction:column;gap:9px}
.scale-grid > div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.scale-k{font-size:13px;color:var(--muted)}
.scale-v{font-family:var(--fm);font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--text-dim)}
.scale-v.em{color:var(--ember)}

/* ============================================================
   FORM DIAGRAMS
   ============================================================ */
.formfig{width:100%;height:auto;display:block}
.fg-limb{stroke:var(--text-dim);stroke-linecap:round}
.fg-torso{stroke:var(--text);stroke-linecap:round}
.fg-far{stroke:var(--faint);stroke-linecap:round;opacity:.55}
.fg-head{fill:var(--text)}
.fg-floor{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.fg-bar{stroke:var(--ember);stroke-width:3.4;stroke-linecap:round}
.fg-bar-c{fill:var(--ember)}
.fg-plate{fill:var(--ember);opacity:.9}
.fg-bench{fill:var(--surface-3);stroke:var(--line);stroke-width:1}
.fg-bench-leg{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.fg-rack{stroke:var(--surface-3);stroke-width:4;stroke-linecap:round}
.fg-pad{stroke:var(--surface-3);stroke-width:7;stroke-linecap:round}
.fg-cable{stroke:var(--ember);stroke-width:1.6;stroke-dasharray:3 3}
.fg-guide{stroke:var(--teal);stroke-width:1.4;stroke-dasharray:4 4;opacity:.6}

.formframes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formframe{margin:0}
.formfig-wrap{background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-soft);border-radius:16px;padding:10px 6px;box-shadow:var(--inset)}
.formframe figcaption{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:center;margin-top:9px}
.formthumb{width:46px;height:52px;flex:none;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2px}
.formthumb .formfig{width:100%;height:100%}

.cue-n{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--fm);font-size:11.5px;font-weight:700;background:var(--ember-dim);color:var(--ember-2);
  border:1px solid var(--ember-line)}
.cue-x{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--rose-dim);color:var(--rose);border:1px solid rgba(242,114,111,.3)}

/* ============================================================
   ONBOARDING — one decision per screen, always explained
   ============================================================ */
#s-onboard{padding:0;display:none}
#s-onboard.on{display:block;padding:0}
#s-onboard > *{max-width:none}
.ob-wrap{display:flex;flex-direction:column;min-height:100%;max-width:600px;margin:0 auto;width:100%}
.ob-top{padding:calc(var(--safe-t) + 14px) var(--sp) 0;flex:none}
.ob-prog{height:3px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.ob-prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--ember-2));transition:width .45s cubic-bezier(.4,0,.2,1)}
.ob-nav{display:flex;align-items:center;justify-content:space-between;height:48px;margin-top:4px}
.ob-back{width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:50%}
.ob-back:active{background:var(--surface-2)}
.ob-back svg{width:20px;height:20px;stroke-width:2}
.ob-step{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ob-body{flex:1;padding:8px var(--sp) 20px;overflow-y:auto;animation:obIn .34s cubic-bezier(.2,.8,.3,1)}
@keyframes obIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ob-q{font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin:6px 0 0}
.ob-sub{font-size:15px;line-height:1.55;color:var(--text-dim);margin:12px 0 0;max-width:34ch}
.ob-why{font-size:13px;line-height:1.5;color:var(--muted);margin-top:14px;padding-left:13px;border-left:2px solid var(--line)}
.ob-foot{flex:none;padding:12px var(--sp) calc(18px + var(--safe-b));background:linear-gradient(180deg,transparent,var(--bg) 34%);position:sticky;bottom:0}

/* large option cards */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.opt{
  display:flex;align-items:flex-start;gap:14px;padding:17px 16px;
  background:var(--surface);border:1.5px solid var(--line-soft);border-radius:var(--r-lg);
  transition:border-color .18s ease, background .18s ease, transform .12s ease;
}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--ember);background:linear-gradient(180deg,rgba(233,180,76,.09),rgba(233,180,76,.02));
  box-shadow:0 0 0 3px rgba(233,180,76,.07)}
.opt-ico{width:40px;height:40px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;transition:background .18s ease}
.opt.on .opt-ico{background:var(--ember-dim)}
.opt-t{font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.opt-d{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}
.opt-mark{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .18s ease}
.opt.on .opt-mark{background:var(--ember);border-color:var(--ember)}
.opt-mark svg{width:13px;height:13px;stroke-width:3.2;color:#1F1704;opacity:0;transition:opacity .18s ease}
.opt.on .opt-mark svg{opacity:1}
.opt-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ember-2);background:var(--ember-dim);border:1px solid var(--ember-line);padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle}
/* What is in today's session, on the hero card. Two columns and a hairline,
   deliberately quieter than the set rows on Train — this is a glance before
   you commit, not a thing to work from. */
.hero-what{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-soft)}
.hw-row{display:flex;align-items:baseline;gap:10px;padding:5px 0}
.hw-n{flex:1;font-size:13.5px;font-weight:550;color:var(--text-dim);line-height:1.35}
.hw-d{flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* Today's stretch list, behind a disclosure. Styled as a row rather than a
   button-looking control: it reveals what is already yours, it does not do
   anything, and a filled button here would compete with Start directly above. */
.str-disc{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;
  padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);
  border:1px solid var(--line-soft);color:var(--text);font-size:14.5px;font-weight:600;
  text-align:left;transition:background var(--t-fast) ease}
.str-disc .grow{text-align:left}
.str-disc-n{font-size:13px;color:var(--faint);flex:none}
.str-disc-c{flex:none;display:flex;align-items:center;color:var(--faint);
  transition:transform var(--t) var(--ease-spring)}
.str-disc-c .ico-svg{width:16px;height:16px}
.str-disc.on{background:var(--surface-3)}
.str-disc.on .str-disc-c{transform:rotate(180deg)}
.str-body{margin-top:12px}

/* ---------- base camp ----------
   The sky is the screen. One full-bleed block that sizes itself to the type
   standing in it, with the ridge on its floor — not a card with a picture in
   it, and not a fixed backdrop the lists slide over, which reads as a bug
   rather than as parallax. */
#more-body{position:relative}
/* Out through the screen's own horizontal padding so the sky reaches the edges
   of the phone, and back in again as padding so the words stay aligned with
   every other line on the screen. */
/* overflow is visible on purpose: the backdrop reaches up past this block's
   own top edge, and the clipping that keeps it off the rest of the screen is
   the scroller's, one level up. .camp-bg does its own clipping for its own
   children. */
.camp{position:relative;
  margin:0 calc(-1 * var(--sp)) 6px;padding:14px var(--sp) 0}
/* Lifted up behind the header, which is the whole of "more sky".

   The dark strip above base camp was never the header band — the band repaints
   the page's own gradient and is invisible against it. It was the page itself:
   a notch, a title and a gap, all of them page-coloured, sitting above a sky
   that only started where this block did. Nothing painted there was wrong;
   there was simply nothing there.

   The number overshoots the header rather than measuring it. Anything above
   the scroller's content box is clipped and unreachable, so overshooting costs
   nothing and a measured value would be one more thing to keep in step with a
   title's font size. What it must NOT do is fall short — hence a check that
   asserts the sky reaches y=0 with a notch faked in.

   Masked out at the foot rather than clipped there. The ridge fills are opaque
   and darker than the page, so `overflow:hidden` alone ended the sky on a hard
   rule across the screen with the mountains sliced off along it — a panel,
   which is the thing this stopped being.

   The mask stops are measured from the FOOT, in pixels, not as percentages of
   the box. They used to be 68% and 86%, which were the same thing while the
   box was 359px tall — and the lift makes it 500-odd, moving the fade up into
   the middle of the range and dissolving the mountains this exists to protect.
   Anchored to the foot, the fade sits over the same 115px of the range at any
   height. */
.camp-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  top:calc((var(--safe-t) + 104px) * -1);bottom:250px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 calc(100% - 115px),rgba(0,0,0,.55) calc(100% - 50px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 calc(100% - 115px),rgba(0,0,0,.55) calc(100% - 50px),transparent 100%)}
/* Night, fading out rather than stopping. A hard edge would put a horizon line
   across the screen where there is nothing to see. */
.camp-sky{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,40,60,.55) 0%,rgba(20,28,42,.32) 46%,rgba(11,13,16,0) 100%)}
/* The field fills the whole sky down to the ridgeline, not a share of a box
   whose height changed underneath it. At 58% of the lifted backdrop the stars
   sat in a band that stopped well above the mountains and read as a sky with
   nothing in it — which is what was reported. `slice` rather than `none`
   keeps them round: the backdrop is stretched by preserveAspectRatio="none"
   everywhere else in this scene, and a stretched circle is an egg. */
.camp-stars{position:absolute;left:0;right:0;top:0;bottom:120px;width:100%;display:block;opacity:.58}
/* Painted after the stars and before the range, so the peaks stand against it
   and the stars nearest the horizon are washed out by it — which is what the
   last of the light does to a sky. Centred behind the massif, not behind the
   middle of the screen. */
.camp-glow{position:absolute;left:0;right:0;bottom:34px;height:300px;pointer-events:none;
  background:radial-gradient(58% 100% at 62% 100%,rgba(240,193,101,.16) 0%,rgba(233,180,76,.07) 38%,transparent 72%)}
/* Each star rests at its own --o. The shimmer multiplies that rather than
   naming a brightness, so a faint star stays faint — a keyframe holding a
   literal opacity turns twelve depths into one blinking row. */
.camp-stars circle{opacity:var(--o,.6)}
@media (prefers-reduced-motion: no-preference){
  /* Eleven seconds of nothing and about half a second of shimmer, staggered
     per star. A sky where every star pulses is a screensaver. */
  .camp-stars circle{animation:starTwinkle 11s var(--ease-in-out) infinite both}
  @keyframes starTwinkle{
    0%,88%,100%{opacity:var(--o)}
    94%{opacity:calc(var(--o) * 2.1)}
  }
}
/* On the floor of the block rather than at its top, which is what makes it a
   horizon instead of a header decoration. The room it needs is padding under
   the stats — see .camp-head — so the mountains are drawn in open sky and the
   first list starts below them rather than on top of them. */
/* Tall enough to hold a whole mountain, which is what this one is. massifHTML
   draws a 430x560 scene at preserveAspectRatio="xMidYMax slice": at 250px the
   box cropped everything above the lower slopes and the summit was simply not
   on screen. 430px shows the peak and still bleeds the foot into the moraine.
   The head's scrim is what keeps the name legible over the top of it. */
.camp-bg .ridge{top:auto;bottom:0;height:430px;opacity:.95}
/* The camp's fire. Sits at the foot of the range, off to one side of the
   centre line so it does not read as a bullet under the name.

   z-index 0 puts it in the same layer as the backdrop while leaving it outside
   the backdrop's mask — see the note on the markup. .camp-head is z-index 1 and
   has no background of its own, so its 150px of bottom padding sits over the
   fire without hiding it. */
.camp-fire{position:absolute;left:24%;bottom:0;width:150px;height:96px;
  z-index:0;pointer-events:none}
/* Firelight, thrown from the base of the flame rather than centred on it —
   light comes off the fuel, and a glow centred on the middle of the fire
   halos it like a sticker. Ember, because that is the brand's own warm.

   The three numbers are one equation, not three guesses: the glow is centred
   on the flame's base (68.75% down a 96px box puts it 30px up from the foot,
   which is where .camp-fire-svg sits), and its radius stops short of the box.
   .camp bleeds nothing past its own edge, so a gradient still carrying alpha
   at the foot of this box is cut off on a rule across the screen — the exact
   seam .camp-bg's mask exists to avoid, reintroduced by the thing standing in
   front of it. Move the flame and the radius moves with it. */
.camp-fire-glow{position:absolute;inset:0;
  background:radial-gradient(36% 44% at 50% 68.75%,rgba(233,180,76,.34) 0%,rgba(233,180,76,.10) 40%,transparent 70%)}
.camp-fire-svg{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
  width:30px;height:22.5px;overflow:visible}
.cf-log{stroke:#4a3a29;stroke-width:2.6;stroke-linecap:round;fill:none}
.cf-out{fill:var(--ember);fill-opacity:.55}
.cf-in{fill:#FFD98A;fill-opacity:.85}
@media (prefers-reduced-motion: no-preference){
  /* Two rates that do not divide into each other, so the fire never repeats a
     pose on a countable beat. Slow enough to be noticed only if you look for
     it — a fire flickering on a UI cadence would be a distraction on the
     screen you come to when you are done.

     transform-box/transform-origin because an SVG path's default origin is the
     *viewport* corner, not the shape: without them the flame slides across the
     logs instead of licking up off them. */
  .cf-out,.cf-in{transform-box:fill-box;transform-origin:50% 100%}
  .cf-out{animation:campFlame 4.3s ease-in-out infinite}
  .cf-in{animation:campFlame 2.9s ease-in-out infinite reverse}
  .camp-fire-glow{animation:campGlow 6.5s ease-in-out infinite}
  @keyframes campFlame{
    0%,100%{transform:scale(1,1)}
    30%{transform:scale(.93,1.08)}
    62%{transform:scale(1.05,.94)}
  }
  @keyframes campGlow{0%,100%{opacity:1}45%{opacity:.72}70%{opacity:.9}}
}

/* The camp itself: type standing in the sky, no border around it. The bottom
   padding is the sky the mountains are drawn in. */
/* pointer-events:none on the block, auto on the one control in it. At z-index
   3 this box sat over the top half of the mountain and ate every tap meant for
   it — elementFromPoint on the summit returned .camp-head. A block of text is
   not a target; the pill inside it is.

   The 150px of bottom padding is gone. It existed to hold the range clear of
   the type, which the scrim does now — and it was 150px of nothing that the
   camp still had to find room for, so on a phone with a long name the scene
   overflowed and the last two tents went behind the nav. */
.camp-head{position:relative;z-index:3;padding:2px 0 34px;pointer-events:none}
.camp-head .camp-member{pointer-events:auto}
.camp-eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ember-2)}
/* Tonight's moon, in the sky rather than in the header, and unlabelled.

   Positioned off .camp-bg's own top, which is one lift above this block, so
   adding the lift back lands it just inside the top of the camp — under the
   header band and clear of it at every notch, because both terms move
   together. Anchored any other way it drifts by exactly one inset between a
   desktop browser and a phone.

   z-index 0 with .camp-head at 1: it is scenery, and the name stands in front
   of it the way the name stands in front of the range. */
/* Reachable by a screen reader, painted for nobody. The camp's controls are
   drawings — a tent, a moon, a mountain — so the only name they have is this
   one. Clipped rather than display:none, which would take them out of the
   accessibility tree along with the pixels. */
/* Measured, not read: getPropertyValue on --safe-t hands back the literal
   text `env(safe-area-inset-top,0px)`. An element has to use it before the
   number iOS substituted can be seen. A class rather than an inline style so
   the instruments can fake a phone's inset on a desktop, where env() is 0. */
.safe-probe{position:fixed;left:-9999px;top:0;padding-top:env(safe-area-inset-top,0px)}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ---- base camp is a camp ----
   The screen fills rather than scrolls. A list grows; a place does not, and
   the moment this scrolled it went back to being a picture at the top of a
   menu. #more-body is a flex column that fills the scroller's content box, so
   the camp's floor is the bottom of the phone whatever the phone is. */
#more-body{min-height:100%;display:flex;flex-direction:column}
/* min-height, so a short phone scrolls instead of crushing the camp. flex:1
   alone lets the block shrink below what the scene needs, and the moraine —
   which is absolutely positioned at a fixed 250px — then climbs up over the
   name. Given a floor it overflows and the screen scrolls, which is the right
   answer on a 4-inch phone even though More is a place rather than a list. */
.camp{flex:1 1 auto;min-height:470px;display:flex;flex-direction:column}
/* The scrim is the height of the TEXT, not the height of the mountain.

   Spanning the whole upper camp at 90% it took the range from 148 to 21 on a
   brightness sample — the mountain was still there and you could barely see
   it, which is what "the mountain looks faint" was. Measured node by node,
   exactly one thing needs it: the "Set out …" line, at 1.35:1 over the summit's
   snow. The name clears on its own at 34px, the stats sit low where the
   mountain is dark anyway, and the membership pill carries its own ground.

   So it is bounded to .camp-head — which ends at the pill — and fades out over
   its last 60px. Below that the mountain is at full strength. On .camp it
   could not be bounded this way, because .camp is the whole screen.

   z-index -1 inside .camp-head, which has z-index 3 and therefore its own
   stacking context: the scrim sits under the head's own words and above
   everything outside it. */
.camp-head::before{content:'';position:absolute;z-index:-1;
  left:calc(var(--sp) * -1);right:calc(var(--sp) * -1);
  top:calc((var(--safe-t) + 120px) * -1);bottom:0;
  background:linear-gradient(180deg,rgba(8,10,15,.92) 0%,
    rgba(8,10,15,.86) calc(100% - 60px),rgba(8,10,15,0) 100%);
  pointer-events:none}
/* The moraine the camp stands on: below the range, above the nav. */
/* Transparent at its own top edge. Given a colour there it draws a rule
   across the screen where the range's foot meets it — the same seam the
   backdrop's mask exists to avoid, reintroduced by the thing in front of it. */
.camp-ground{position:absolute;left:calc(var(--sp) * -1);right:calc(var(--sp) * -1);
  bottom:0;height:250px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(18,22,31,0) 0%,#0C0F16 24%,#080A10 62%,#06070C 100%)}
/* ...and the floor carries on under the nav, to the foot of the phone.

   The camp ends where .camp ends, and below that sits the padding every screen
   reserves so its last card can scroll clear of the floating nav. On a screen
